pact_version: 5
id: docpage-passage-and-title-split
title: Doc pages and JIRA issues declare their chunk relation; page titles split into words
tier: 2
why: 'archi-physics/cms-kb#6 and comp-ops design row 13: TWiki and docs-site pages are hard
  to find. A page''s text lives on document_chunk rows reached by `contains`
  (archi.sources.twiki, archi.sources.docs), and a JIRA issue''s the same way
  (archi.sources.jira). Neither parent subtype declared that relation, so a passage hit named
  no page or issue as its parent and passage-ranked search could not roll chunk scores up to
  them. A TWiki title is one WikiWord that the search index reads as a single token.


  okg#2914 (merged to okg dev 2026-09-29) resolves a passage''s parent by the subtype its edge
  comes from, which makes a per-subtype `okg_passage_rollup` declaration usable next to okg''s
  own Document declaration. `okg_searchable_text_path_fields` already exists; okg#2925 (in
  review) extends its split to CamelCase.


  DECISION: declare on both DocumentationPage and JiraIssue, in the form okg''s own Document
  subtype uses (edge_type contains, child_subtype DocumentChunk); declare only `title` as a
  path field on DocumentationPage. Both copies of sources.yaml (package and cern-team bundle)
  change together.


  PIN NOTE: archi CI tests against okg ac078aabd5, which predates #2914. Both annotations are
  known there and the catalog composes. At that pin, a passage under two declared parents
  reads as ambiguous_declaration rather than declared_but_unlinked; neither is citable, and
  rank_by=passages on documentation_page or jira_issue works through the parent''s own
  declaration. The parent-naming effect needs an okg pin at or after #2914; the pin bump is
  CI configuration and is left to the operator.'
