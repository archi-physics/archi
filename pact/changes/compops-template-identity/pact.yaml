pact_version: 5
id: compops-template-identity
title: Comp-ops registry templates declare profiles okg accepts
tier: 2
why: 'After compops-reader-adapters, each comp-ops reader has an adapter okg can run, but
  every registry template still declared a profile combination okg refuses at install (deployment.source_registry.profile_invalid):
  record_identity_kind remote_id under discovery_crawl (CRIC, CRIC core, DQM, GOCDB) or reference_catalog
  (CondDB, DBS, GitHub repositories), and content_hash revisions under mutable_api (WMStats).
  A pasted template could not be installed.


  The okg-deployments cms registry ran the same reader code (archi''s readers are verbatim
  ports; the emitted source_record_id keys and node ids are identical) and declared scoped_locator,
  domain_key and updated_at for these sources. This change makes the same declarations and
  changes no reader code, so no node id or record key changes and a comp-ops graph built by
  cms is not re-keyed. okg dev reads record_identity_kind only for the profile check and the
  registry binding fingerprint; it does not check emitted keys against it.


  WMStats declares updated_at, not version_token: its cache carries a per-workflow update
  time (the documented updated_at field, emitted as the workflow node''s updated_at attribute)
  and no upstream version token. Its emitted source_revision stays the run-level cache hash,
  as the Jira reader''s does under the same declaration.


  Strict registry admission also refused the GitHub template''s bare params: (null), so it
  becomes params: {}.'
