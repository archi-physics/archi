requirements:
- id: req.compops-template-identity.main
  statement: 'Every comp-ops registry template passes okg''s install-time profile check and
    strict registry admission, without changing what the readers emit.


    For CRIC, CRIC core, DQM, GOCDB downtimes, CondDB global tags, DBS datasets, WMStats workflows
    and GitHub repositories, validate_profile_tuple accepts the template''s tuple, strict
    admission binds its params, and the declared record_identity_fields equal the source_record_id
    keys the reader emits for its primary records.


    Acceptance:

    - acc.compops-template-identity.accepted: test_compops_template_profile_tuples_are_all_accepted
    and test_compops_template_passes_strict_registry_admission fail on the compops-reader-adapters
    templates (9 failed) and pass after, on okg 5b2fd076cc and on okg dev. [evidence: executed_test]

    - acc.compops-template-identity.stable: no reader code changes; the existing per-reader
    tests, which pin node ids, pass unchanged. [evidence: executed_test]'
tasks:
- id: task.compops-template-identity.deliver
  requirement: req.compops-template-identity.main
  verification: 'Change the eight template declarations, flip the refusal-list test to assert
    zero refusals, add a strict-admission test per template, and check the declared identity
    fields against emitted record keys.


    Proof: the full archi suite on okg 5b2fd076cc (CI''s pin) and on okg dev.


    Test plan:

    - python/tests [evidence: pytest]'
