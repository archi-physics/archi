  note: 'task.r3-bundle-cluster-manager.tickets (#735): the tickets pack reads JIRA as well as Redmine, with nothing
    CERN-specific. archi.downloaders.tickets reads Redmine, any JIRA Server/Data Center over the REST v2 search API
