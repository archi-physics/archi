requirements:
- id: req.empty-cache-fails-loudly.main
  statement: 'No archi cache-backed source claims a complete scope over an empty or broken
    cache, and preflight() agrees with run().


    Acceptance:

    - acc.empty-cache-fails-loudly.list-caches: for dbs, conddb, wmstats, dqm, indico, jira
    and docs, an empty list, zero-byte, whitespace-only, truncated, unreadable or missing
    records cache makes run() emit no facts, set completed_scope=False and report cache_missing
    with the path as cache_path and in the reason, in scope_complete and reconcile; an error-shaped
    payload reports endpoint_failed; preflight() reports the same status; a one-record cache
    still claims its scope. [evidence: executed_test]

    - acc.empty-cache-fails-loudly.object-caches: for cric and cric_core, each cache file
    that is {} or broken is cache_missing, a [] is endpoint_failed, empty responsibility rows
    are cache_missing, a federations cache without CMS is endpoint_failed; an error body,
    a sites cache with no CMS site name, only non-object values, no 3-field responsibility
    row, responsibility rows that map to no operator, or a nested shape that breaks the builder
    is endpoint_failed and never a crash; one non-object entry or bad row stops the scope
    claim; all of it in run() and preflight(); full caches still claim scope. [evidence: executed_test]

    - acc.empty-cache-fails-loudly.gocdb: an empty gocdb downtime list or an empty CRIC topology
    cache is cache_missing with no facts and completed_scope=False in run() and preflight();
    a topology error body is endpoint_failed; a missing downtime or topology cache is cache_missing
    in both; the snapshot builder still accepts a gocdb group. [evidence: executed_test]

    - acc.empty-cache-fails-loudly.twiki: an unreadable snapshot root is cache_missing saying
    it could not be read; an unreadable subfolder or topic file and a zero-byte, whitespace-only
    or NUL-only topic stop the scope claim with endpoint_failed; a max_files cap that cuts
    the listing claims no scope; hidden files and folders are not topics; preflight() matches
    run() for missing seeds and each of these cases. [evidence: executed_test]

    - acc.empty-cache-fails-loudly.sso-docs: an SSO docs crawl that yields zero pages reports
    endpoint_failed with no complete scope. [evidence: executed_test]'
