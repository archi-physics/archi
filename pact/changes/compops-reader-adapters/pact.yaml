requirements:
- id: req.compops-reader-adapters.main
  statement: 'Each comp-ops reader''s docstring registry template names a ConnectorAdapter
    that okg''s runner can drive.


    For CRIC, CRIC core, DQM, GOCDB downtimes, CondDB global tags, DBS datasets, WMStats workflows
    and GitHub repositories, the class the template names is a ConnectorAdapter whose profile
    and change_probe_kind are string literals equal to the reader''s own values and to the
    template''s source_class; the template''s params bind against the adapter''s signature;
    and the adapter, run on a small cache at the template''s paths, returns a result carrying
    next_cursor and emits the reader''s primary node subtype.


    Acceptance:

    - acc.compops-reader-adapters.runs: test_compops_template_names_an_adapter_that_runs fails
    on main for all eight readers and passes after. [evidence: executed_test]

    - acc.compops-reader-adapters.refusals-pinned: the templates the substrate still refuses
    at install are listed with the rejected clause, and the test fails when one is fixed.
    [evidence: executed_test]'
tasks:
- id: task.compops-reader-adapters.deliver
  requirement: req.compops-reader-adapters.main
  verification: 'Add the adapters, point each template at its adapter, and extend test_bundle_source_adapters.py
    with a test that reads each template out of the module docstring.


    Proof: the new tests fail on main (8 failed) and pass after; the full archi suite passes.


    Test plan:

    - python/tests [evidence: pytest]'
