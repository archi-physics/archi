pact_version: 5
id: compops-reader-adapters
title: Registry adapters for the comp-ops readers
tier: 2
why: 'Comp-ops needs CRIC, CRIC core, DQM, GOCDB downtimes and CondDB global tags in a graph,
  and none of them can run under okg today. Each reader module documents a registry-entry
  template, and that template names the bare reader class. okg''s runner reads next_cursor
  off every run result (okg dev src/okg/substrate/ingest/runner.py); a reader returns the
  public SDK''s ConnectorRun, which has no such field, so every run fails with AttributeError.
  The bundle''s own sources hit the same failure and were fixed by ReaderAdapter subclasses
  (JiraIssueAdapter and five others); these readers were never given one.


  This adds one ReaderAdapter subclass per reader, copying JiraIssueAdapter exactly, and points
  each docstring template at it. DBS datasets, WMStats workflows and GitHub repositories take
  the same mechanical fix in the same change. Reader behavior is unchanged.


  NOT FIXED, and pinned in a test rather than hidden: all eight templates also declare a profile
  combination the substrate refuses at install (record_identity_kind remote_id under discovery_crawl
  or reference_catalog; content_hash revisions under mutable_api for WMStats). Fixing that
  changes which record key or revision each reader emits, so it needs its own change. HyperNews,
  SITECONF, the four MONIT readers and CERNPreflightSource are not covered: MONIT readers
  take a run cursor the adapter does not forward, and CERNPreflightSource authors the substrate-reserved
  source_name parameter.'
