pact_version: 5
id: r3-302-okg-dep
title: 'archi-kb 3.0.2: depend on akmon (AKMON) from PyPI, so one pip install sets up Archi'
tier: 2
why: 'Until 3.0.1, the graph engine okg (AKMON) was published only as a wheel on GitHub releases,
  and PyPI rejects packages that depend on a URL, so archi-kb declared no engine dependency.
  `pip install archi-kb` then succeeded with no graph engine, and every install page carried the
  AKMON wheel URL and its sha256. Jason chose to publish AKMON on PyPI (board d1009, d1010, d1011).
  Its first PyPI release is 0.6.0, which renames the distribution from okg to akmon and keeps the
  `okg` import and command (board d1141 "Rename only the distribution"; publish item d1323);
  0.4.0 and 0.5.0 stay GitHub-only, so the earlier plan (okg 0.4.0 on PyPI, d1016) is replaced.
  The rename breaks archi where it reads distribution metadata: with akmon 0.6.0 installed,
  `archi init` refused ("okg is not installed") because it looked up `okg` only, and the MCP
  Dockerfile built `.../v0.6.0/okg-0.6.0-py3-none-any.whl` under the name okg, a file the
  release does not ship. 0.6.0 also reads linker fields through `_chronos.query_strict`, which
  one pack test did not fake. 3.0.2 declares akmon>=0.6.0,<0.7, reads either name, names the
  right wheel per engine version, and the install becomes one line.'
affected_code:
- python/pyproject.toml
- python/archi/__init__.py
- python/archi/bundles/lock.py
- python/archi/stack/
- python/archi/cli/init.py
