requirements:
- id: req.r3-302-okg-dep.dependency
  statement: 'archi-kb declares akmon>=0.6.0,<0.7 as a dependency and does not declare okg; the
    akmon wheel CI installs, pinned by URL and sha256, lies inside that range and inside every
    shipped bundle''s okg range.


    Acceptance:

    - acc.r3-302-okg-dep.meta: test_package_metadata checks the declared range and every bundle
    range against the CI pin. [evidence: pytest]'
- id: req.r3-302-okg-dep.rename
  statement: 'archi reads the installed engine version from the akmon distribution, else okg; the
    instance''s MCP image installs the AKMON release wheel named for the instance''s engine
    version (akmon from 0.6.0, okg before); archi doctor warns when both distributions are
    installed.


    Acceptance:

    - acc.r3-302-okg-dep.lookup: test_lock, test_stack and test_doctor cover the lookup order, the
    wheel name per version and the warning. [evidence: pytest]

    - acc.r3-302-okg-dep.wheel: the affected tests pass with the akmon 0.6.0 wheel installed and
    no okg distribution. [evidence: executed_test]'
- id: req.r3-302-okg-dep.install
  statement: 'Every install page says `pip install archi-kb==3.0.2` and nothing else to install
    the engine, and the nightly installs the checkout with no separate engine step, so akmon
    comes from PyPI.


    Acceptance:

    - acc.r3-302-okg-dep.pages: test_package_metadata and test_docs_quickstart. [evidence: pytest]

    - acc.r3-302-okg-dep.e2e: the nightly passes with akmon resolved from PyPI. [evidence: executed_test]'
