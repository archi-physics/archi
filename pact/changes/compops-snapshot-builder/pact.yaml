pact_version: 5
id: compops-snapshot-builder
title: Move the cms cache downloaders into archi and add a cache snapshot builder
tier: 2
why: 'Row 6 ("A4") of the comp-ops design that Jason approved on 2026-09-28 (okg branch claude/lane-b,
  pact/changes/epoch-lane-b-comp-ops/evidence/compops-inventory-design.md, sections 1d, 6.4
  and 7). Two gaps block a comp-ops install that needs no CERN credentials.


  First, the only cache downloaders (download_jira.py, download_static_docs.py, sso-login.py
  and their source-download-manifest.yaml) live in okg-deployments cms/scripts, which the
  comp-ops rewrite deletes. The design moves them to archi-okg, where docs/connector-caches.md
  already names them. They import nothing from okg; their defaults assumed the okg-deployments
  layout (data/cms/..., <repo>/.cookies).


  Second, six of the ten required source groups have no downloader and two need CERN tokens,
  so the design ships one private, checksummed cache snapshot. Nothing can build or check
  one today. The builder must validate each group the way its archi reader reads it, remove
  every email address, drop fields the readers never read, and write deterministic archives
  with a lock file a fresh machine can verify.


  Jason''s answers, relayed by the lane B lead on 2026-09-28: (1) the first snapshot mixes
  collection dates (Aug 31 for cric, cric-core, jira, gitlab-docs and twiki-eos; June 12-16
  for indico, dqm, gocdb-downtimes, cmssw-releases and conddb-global-tags), so each group''s
  collection date is a required config field carried into the lock; (2) WMStats drops RequestorDN
  and keeps Requestor by default. This change builds no real snapshot and reads no real cache;
  that is design row 12, after this merges.'
