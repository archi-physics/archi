requirements:
- id: req.compops-snapshot-builder.downloaders
  statement: 'The JIRA, static-docs and SSO-login downloaders and the source download manifest
    run from archi-okg as python -m archi.downloaders.{jira,static_docs,sso_login}, import
    nothing from okg, and write caches the archi readers accept. Default output paths follow
    ARCHI_DATA_ROOT (data/jira, data/gitlab-docs, data/docsite) and cookie files go to --cookie-dir,
    else ARCHI_COOKIE_DIR, else ./.cookies. Record shapes and the login flow are unchanged
    from okg-deployments main 32f2b4e3c2.


    Acceptance:

    - acc.compops-snapshot-builder.jira-download: with a fake jira client, the downloader
    pages through issues, writes records.json and meta.json, and the archi JIRA reader reads
    the cache with a completed scope; a missing token or a missing jira package stops with
    a named message. [evidence: executed_test]

    - acc.compops-snapshot-builder.docs-download: with a fake HTTP session, the static-docs
    downloader writes GitLab and public-page caches that the archi documentation reader reads
    with a completed scope, merges by URL, and tries a GitLab token before anonymous access.
    [evidence: executed_test]

    - acc.compops-snapshot-builder.sso: cookie files keep only service and SSO-domain cookies,
    are mode 0600 and readable by archi.auth.cookies; --check without cookie files exits 1.
    [evidence: executed_test]'
- id: req.compops-snapshot-builder.snapshot
  statement: 'python -m archi.snapshot build takes a config mapping each group to its cache
    directory and a required collection date (YYYY-MM-DD or a YYYY-MM-DD..YYYY-MM-DD range),
    so one snapshot can mix collection dates. For each group it refuses, with an error naming
    the group, file and record, any missing file, invalid JSON, wrong shape or record the
    reader would skip or drop; any symbolic link, dot-named path or path resolving outside
    the group directory; any text file that holds a NUL byte, is more than 1% control characters,
    or is not UTF-8 (TWiki pages alone decode each invalid byte run as cp1252, Latin-1 for
    its undefined bytes, keep valid UTF-8 intact, are stored as UTF-8 and are redacted after
    decoding, with page and fallback-byte counts in the lock); any string where a control
    character splits an address; any file path containing an address; and any unreadable file
    or too-deeply nested JSON (a named refusal, not a traceback). It removes every email address
    from every string with redact_email_addresses and records the count removed; drops every
    field the reader does not read plus the configured drop_fields (WMStats keeps Requestor
    and removes every RequestorDN and DN key at any depth, which no keep_fields entry can
    undo); and runs the group''s archi reader, which must report health ok, a completed scope,
    and the same facts as from the unpruned cache. If any group is refused nothing is written.
    Otherwise it writes one deterministic tar.zst per group and snapshot.lock.yaml with each
    group''s collection date, SHA-256, size, file count, record count, addresses removed and
    contents digest. docs/cache-snapshot.md states that snapshots are private okg-deployments
    assets never committed to or published from this public repository, and .gitignore ignores
    them. python -m archi.snapshot verify checks archives against a lock.


    Acceptance:

    - acc.compops-snapshot-builder.malformed: a malformed record in any of 11 JSON groups
    refuses exactly that group and writes nothing. [evidence: executed_test]

    - acc.compops-snapshot-builder.addresses: a planted address in each of the 12 text-bearing
    groups is absent from every archive; so is a spelled-out address (jdoe[AT]cern(dot)ch),
    removed with archi-okg #13''s redact_obfuscated_email_addresses and counted as obfuscated_addresses_removed,
    while free prose (john.doe at cern.ch) is kept; a git@ host remote is kept in JIRA and
    TWiki and an address after it is removed; after merging main (#13), redact_email_addresses
    and redact_obfuscated_email_addresses equal main 6193edd0ca on random strings including
    git@ variants; the final review''s gaps are closed for spelled-out forms too: a control
    character inside one (jdoe<DEL>[at]cern.ch) refuses the group, a stray byte next to or
    inside one (jdoe<0x93>[at]cern.ch, jdoe[at]<0x93>cern.ch, jdoe<0x93>(at)cern(dot)ch, john.doe<0x93>_at_cern.ch)
    stores the page without its invalid bytes, and ANSI sequences are stripped from JSON strings
    as well as text files. [evidence: executed_test]

    - acc.compops-snapshot-builder.jira-facts: the archi JIRA reader emits the same facts
    from a raw JIRA fixture and from the snapshot''s redacted copy. [evidence: executed_test]

    - acc.compops-snapshot-builder.deterministic: two builds give byte-identical archives.
    [evidence: executed_test]

    - acc.compops-snapshot-builder.verify: verify fails, naming the group, on one flipped
    byte. [evidence: executed_test]

    - acc.compops-snapshot-builder.requestor-dn: the WMStats DN never appears in the output,
    even when a config asks to keep it or the field that holds it; Requestor is kept. [evidence:
    executed_test]

    - acc.compops-snapshot-builder.transcode: on the second review''s mixed page (three addresses
    in valid UTF-8 plus one stray 0x93 byte) all three addresses are removed and the valid
    UTF-8 is kept; a Latin-1 page with an accented-local-part address loses the address; a
    cp1252 page keeps its smart quotes as UTF-8; the third review''s four examples (a stray
    0x93 before the @, 0x96 or 0xA0 inside the domain, an overlong 0xC0 0x80 next to the @)
    and an address split by a C1 fallback byte are removed whole, by storing that page without
    its invalid bytes (pages_bytes_dropped); 2,000 fuzzed pages leave no address found in
    the dropped reading in the output; ANSI colour sequences are stripped before redaction;
    a page is binary only with more than 1% and at least 16 control characters, \f and \v
    not counted; the lock counts pages, fallback bytes and dropped-byte pages; the CMSSW group
    reads records.json when releases.map is absent and prefers the map when both exist. [evidence:
    executed_test]

    - acc.compops-snapshot-builder.wrong-export: a CRIC responsibilities.json shaped like
    the sites-compat export (other column names, or five fields per row), each of the 42 ways
    to swap a CRIC or CRIC-core file for a sibling export, and JIRA, Indico, CondDB, DBS or
    CMSSW records from another export each refuse the group by name; signature keys need 95%
    of records (19 of 20 passes, 18 of 20 and an empty file are refused); --tmp-dir, or the
    system temp dir by default, receives every reader-check copy and is empty after a build,
    a refusal and a SIGTERM (which also removes the output staging directory); a full --tmp-dir
    is reported as a write failure. [evidence: executed_test]

    - acc.compops-snapshot-builder.file-dates: an optional per-group file_dates map is carried
    into the lock and must name a file the group archives; an optional per-group note (at
    most 300 characters, refused if it holds an address) is carried into the lock, so the
    June CRIC group records collected: 2026-04-09 with the note "files written 2026-06-12;
    fetched 2026-04-09" (lead decision, 2026-09-28). [evidence: executed_test]

    - acc.compops-snapshot-builder.unsafe-input: a symlinked file or directory, a dot path,
    UTF-16 or NUL-bearing text, non-UTF-8 text outside TWiki, an address in a file name, an
    unreadable file and deeply nested JSON each refuse the group by name. [evidence: executed_test]'
tasks:
- id: task.compops-snapshot-builder.downloaders
  requirement: req.compops-snapshot-builder.downloaders
  verification: 'Copy the three scripts and the manifest verbatim in one commit, adapt them
    in the next, and test them offline.


    Proof: the downloader tests fail against the verbatim copies and pass with the change.


    Test plan:

    - python/tests/downloaders [evidence: pytest]'
- id: task.compops-snapshot-builder.snapshot
  requirement: req.compops-snapshot-builder.snapshot
  verification: 'Add archi.snapshot and its tests on synthetic fixtures only.


    Proof: every snapshot test passes; disabling each safeguard in turn (redaction, pruning,
    the record check, the fixed mtime, member sorting, the verify SHA-256 check, the reader
    fact comparison, the WMStats DN drop) makes at least one test fail; the full archi suite
    passes.


    Test plan:

    - python/tests/snapshot [evidence: pytest]

    - python/tests [evidence: pytest]'
