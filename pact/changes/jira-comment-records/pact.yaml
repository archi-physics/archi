pact_version: 5
id: jira-comment-records
title: JIRA comments as jira_comment records with content-hash ids; issue chunks unchanged
tier: 2
why: 'JiraIssueSource keeps a ticket''s comments only inside its document_chunk text, as
  "author created: body" lines. An agent reading a ticket gets the description and a notice that N
  passages are not in the read; it cannot list, filter or order a ticket''s comments (mitdbg/okg#3666).


  Decision (Jason, relayed by the orchestrator, 2026-10-14): each comment becomes a typed record
  linked to its ticket, and okg reads a ticket as its fields, its description and then its comments
  in order. Comment ids are made from a hash of the comment''s content, because the records cache
  keeps no JIRA comment id.


  The new outputs follow the standing rule that a consumer''s variant is an option, off by default:
  comment_records=True emits one jira_comment per comment, jira_issue has_comment jira_comment
  (attrs.position) and jira_comment authored_by person, and comment_count on each issue. The id is
  jira:<KEY>#c-<first 12 hex of sha256(created|author|body)>, over the same cleaned strings the
  chunk text uses (_pg_text, body stripped), with -1, -2, ... on an exact repeat inside one issue.
  created enters the hash as its UTC instant in one fixed format, because JIRA renders times in the
  fetching account''s zone (the comp-ops snapshot holds +0200 and +0100 offsets): a refetch in
  another zone keeps every id. A time that does not parse, or has no zone, is hashed as the raw
  string and the comment says so (id_basis content_raw_created instead of content). The raw string
  stays the created attribute. An edited body or a renamed author re-keys that comment (one
  removal, one addition), and deleting an earlier repeat shifts the suffix of the later copies.


  Access rules (review M2). Each comment carries the issue key and the issue''s project and comes
  from the same source, so a rule on the project or on the source matches its comments. A rule on
  the issue''s own record does not: okg builds a record ref from the whole source record id, and the
  comment''s ({issue_key, comment}) differs from the issue''s ({issue_key}). Chunks behave the same
  way today. okg''s test_comment_lineage_filter.py (design section 6) is the gate before any
  deployment turns the option on; the bundle example says so.


  Search (review M3). A comment has no text attribute and declares no searchable fields, so okg''s
  full-text index (built on attrs.text) does not hold it; the issue''s chunks stay the one search
  unit for comment text, and body holds the comment for reads. issue_key, project, author and
  created are filterable.


  Two parts are not behind the option, on purpose. The issue node now also carries environment,
  fix_versions, parent_key, issue_links and subtasks, which were chunk-only; like resolution,
  labels and components in compops-data-links, a deployment''s next JIRA ingest rewrites each issue
  node once with them (missing values are empty strings or lists). And JiraIssue declares
  okg_record_parts (has_comment, JiraComment, count_attr comment_count). An okg that does not know
  the annotation ignores it; one that does reads an issue from its comment records only when the
  issue carries comment_count, so a deployment that leaves the option off is read from its chunks.
  The probe fingerprint now also covers the module functions that make comment ids, so a later
  change to the id scheme re-runs a cursor ingest over an unchanged cache; that, and the changed
  class, change every deployment''s probe token once.


  The chunks are byte-identical with the option on or off and against main''s adapter: chunk ids
  hash the chunk text, and a changed chunk would re-key every JIRA chunk in a graph.


  Known limits, disclosed: an edited comment''s old record is retracted only by a complete-scope run
  (scope_complete or reconcile; the example config uses scope_complete), so after a cursor run both
  versions stay linked and comment_count undercounts the links. JiraComment is its own class, apart
  from the okg ticket module''s generic Comment, so a query for comment finds no JIRA comments.
  Authors are matched to person records by display name, as assignees and reporters already are:
  two people with one name merge and a renamed person splits.


  OUT OF SCOPE: keeping JIRA''s own comment id, updated time and visibility in the downloader (a new
  fetch; the id scheme would then move to jira_id once, before a real publish), the okg read side
  (record_parts read, view, activation refusal, test_comment_lineage_filter.py), and the lab source
  registry entry.'
