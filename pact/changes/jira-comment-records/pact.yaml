requirements:
- id: req.jira-comment-records.main
  statement: 'With comment_records on, JiraIssueSource emits each comment of an issue as a
    jira_comment record with a content-hash id that does not depend on the fetch''s time zone,
    linked to its issue and its author and carrying the issue key and project; comments stay out
    of the full-text index; the issue chunks stay byte-identical; with the option off the source
    emits no comment record, edge or count.


    Acceptance:

    - acc.jira-comment-records.records: An issue with three comments, two of them identical, gives
    three jira_comment ids with -1 on the repeat, three has_comment edges in source order and
    three authored_by edges; each id is the hash of the UTC created, author and the stripped body;
    the same instant written in any zone gives the same id; an unparseable time hashes the raw
    string with id_basis content_raw_created; two ingests of the same data give the same ids and
    one edited comment changes only its own id; each comment''s source record id names its issue
    key and its project is the issue''s; a comment has no text attribute; comment_count counts the
    records; the probe fingerprint names the id functions; with the option off none of this is
    emitted. [evidence: executed_test]

    - acc.jira-comment-records.schema: okg composes JiraComment, jira_issue has_comment
    jira_comment and jira_comment authored_by person from both schema copies; every emitted
    attribute is declared; JiraComment declares no searchable fields; okg_record_parts names only
    declared attributes. [evidence: executed_test]

    - acc.jira-comment-records.chunks-identical: Over a real JIRA records snapshot, every
    document_chunk, contains and references fact from this branch, with comment_records off and on,
    equals main''s adapter''s, in the same order, and the jira_comment count equals the number of
    non-empty comments in the snapshot. [evidence: executed_test]'
