pact_version: 5
id: ws-cds-jira-quickstart
title: CDS bounded runs are healthy, JIRA reads public projects without a token, quickstart points at this repo
tier: 2
why: 'A public-data run of the cern-team bundle (2026-10-20) found three faults that stop a newcomer.


  CDS: a harvest stopped by the operator''s own max_records bound was reported as health
  endpoint_failed (cds.py run). okg admission refuses a source that is not healthy, which
  blocks the publish of every source, although cds.yaml.example advertises max_records as a
  safe trial bound. Now a run that stops at the bound reports health ok, completed_scope
  False and a reason that says it was bounded. A harvest that breaks mid-walk (network or
  resumption failure) is still endpoint_failed.


  JIRA: the downloader refused to start without a token, although public projects (for example
  ADAPTYST) read anonymously, and the jira package was not declared anywhere. The token is
  now optional (anonymous when unset), the package is documented as pip install jira (PyPI "archi" is an unrelated package), with an optional extra declared, and a
  project that is not visible says so instead of JIRA''s "The value X does not exist for the
  field project".


  Quickstart: step 1 installed an old archi (archi-physics/archi@archi_v3, no cds or
  indico_live) instead of this repository; the inspect/filter/MCP role-password step was
  missing; code_graph (code symbols) was opt-in with no instructions and no source entry, so okg add code-structure reported activation_blocked and wrote nothing; and the intro said TWiki
  was the only unverified part, when TWiki needs a CERN login today.


  NOT CHANGED: TWiki anonymous access (another worker), per-contribution Indico records, PDF
  text, the quickstart beyond these points. The code_structure example passes the v0.2.0 activation check (probe) but a full publish with it was not run here.'
