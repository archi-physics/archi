  requirement: req.ws-cds-jira-quickstart.main
  verification: 'pytest python/tests/sources/test_cds.py python/tests/downloaders/test_downloader_jira.py -q, plus the live runs against the public CDS OAI endpoint and its.cern.ch ADAPTYST.


    Test plan:

    - python/tests [evidence: pytest]'
