requirements:
- id: req.ws-cds-jira-quickstart.main
  statement: "A CDS run bounded by max_records is healthy; the JIRA downloader needs no token for a public project; the quickstart installs this repository.\n\nAcceptance:\n- acc.ws-cds-jira-quickstart.cds: a CDS run that stops at max_records returns health ok with completed_scope False and a reason naming the bound; a broken resumption chain is still endpoint_failed. [evidence: pytest]\n- acc.ws-cds-jira-quickstart.jira: with no token set the downloader runs anonymously and writes a cache for a public project; a project that is not visible stops with a message saying it needs a token; a missing jira package says pip install jira; a 401 with a token says the token was rejected or lacks access; error text never echoes the raw JIRAError string. [evidence: pytest]\n- acc.ws-cds-jira-quickstart.live: the cds source with max_records=50 against the public OAI endpoint reports health ok, and the downloader with no token on ADAPTYST writes records. [evidence: manual]\n- acc.ws-cds-jira-quickstart.docs: docs/cern-team-quickstart.md installs archi from this repository, includes okg db role-passwords --apply, gives working code_graph steps backed by a shipped code_structure.yaml.example whose activation probe returns 0 findings (the empty entry okg add builds returns 2), and says TWiki needs a CERN login. [evidence: manual]\n\nScenarios:\n- scn.ws-cds-jira-quickstart.fast-path Fast-path work is verified\n  Given a small nontrivial change fits one requirement\n  When the declared verification runs\n  Then the requirement has executed proof before completion"
