pact_version: 5
id: compops-release-type
title: CMSSW release_type keeps the source value; release_kind holds the derived kind; families get their own ids
tier: 2
why: 'cmssw.py stored the kind it derived from the label in release_type, overwriting the releases.map
  type. CMSSW_15_0_19_patch2 is a Production release in the source but was stored as release_type
  patch, so a count of CMSSW_15_0 Production releases on the comp-ops graph returned 22 instead of 45.


  The derived release-family node used the id cmssw_release:CMSSW_15_0_X, which is also the label of
  the cms-bot integration-series row for that series (type Development, state IB). The parser dropped
  those 58 rows, so they never reached the graph.


  Decision (Jason, relayed by the orchestrator, "relkind A"): release_type keeps the source value unchanged; a new
  attribute release_kind holds the derived kind; the CMSSW_n_m_X rows get their own records. Families
  move to cmssw_release_family:CMSSW_<major>_<minor> with release CMSSW_<major>_<minor> (release is the
  alias field, and okg refuses an alias value two records share), so every
  cmssw_release:<label> id and every alias value names exactly one record.


  Two other readers name CMSSW_n_m_X: conddb (a global tag''s release) and the GlobalTagReleaseLinker
  cross-link (global_tag.release = cmssw_release.release, exact). Both keep naming
  cmssw_release:CMSSW_n_m_X, which is now the integration-series record. conddb only stops treating a
  concrete release as making that id known, and its placeholders carry release_kind, not
  release_type.'
affected_code:
- python/archi/sources/cmssw.py
- python/archi/sources/conddb.py
- python/archi/schemas/operations.yaml
- bundles/cern-team/schemas/operations.yaml
- python/tests/sources/test_cmssw.py
- python/tests/sources/test_conddb.py
- python/tests/test_bundle_source_adapters.py
- python/tests/fixtures/cmssw/releases_15_0.map
requirements:
- id: req.compops-release-type.main
  statement: 'Every cmssw_release record from releases.map carries the source type unchanged in
    release_type and okg''s derived kind in release_kind; every CMSSW_n_m_X row is a record of its own;
    derived release families carry no release_type and use ids and alias values no source row uses.


    Acceptance:

    - acc.compops-release-type.parse: CMSSW_15_0_19_patch2 parses to release_type Production and
    release_kind patch; CMSSW_15_0_X and the 15.0 family are two records; the real CMSSW_15_0 slice of
    releases.map gives Production 45 and Development 4. [evidence: executed_test]

    - acc.compops-release-type.publish: On a copy of the comp-ops graph, an ingest and publish of
    cmssw_releases leaves release_type only Production, Development or absent (families), raises
    CMSSW_15_0 Production releases from 22 to 45, adds the 58 integration-series records, and doctor
    reports no alias collision. [evidence: published_generation]'
tasks:
- id: task.compops-release-type.deliver
  requirement: req.compops-release-type.main
  verification: 'Split release_type and release_kind in cmssw.py; keep CMSSW_n_m_X rows; move family
    ids; update conddb targets and placeholders; declare release_kind and series in both schema copies; add tests
    that fail on main; publish on a copy of the comp-ops graph and compare release_type and
    release_kind counts before and after.


    Test plan:

    - python/tests [evidence: pytest]'
