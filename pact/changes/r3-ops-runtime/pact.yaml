  head: db2485b6c90891364710328f71ff62804618f4ff
  at: '2026-10-26T00:03:35+00:00'
  note: 'acc.r3-ops-runtime.e2e: a fixture automation (stub proposer, a stub mediator that writes a marker
    row) runs on a real okg 0.2.0 worker as a deployment workflow started by a scanner: context gate,
    pinned read, proposal with cited evidence (ids checked against the pinned read), decision by level,
    mediator step, outcome, ops records admitted and read back from the published graph. L0 ends observed
    with no marker, L1 ends drafted with no marker, L2 approved executes once and resolves, L2 rejected
    ends rejected. acc.r3-ops-runtime.no-l3: L3 or an unknown level is refused at validate (req.pack)
    and at run start (lab: archi.yaml set to L3 is refused, citing ADR 0002 D13; test_loop.py and
    test_levels.py). acc.r3-ops-runtime.timeout: an unanswered L2 proposal ends timed_out with no marker
    and a late archi ops approve is refused; with the worker down okg accepts a late approval (ask O8,
    mitdbg/akmon#21), and on restart the run still does not execute: the mediator step re-reads the
    escalation and refuses (its refusal is in the worker log). The mediator runs at most once across a
    crash and replay (an attempt row before the call; a replay reports unknown). Lab r15: 107 checks,
    all passed; full suite 2729 passed, 17 skipped. Four independent reviews; their findings are fixed.'
