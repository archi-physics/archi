    -q; python/tests/ops/scratch_ops_runtime_run.sh (a dev host, akmon-postgres v0.2.0, okg 0.2.0 worker, a clean clone of the head; log in the lane's e2e-results.md)
  head: db2485b6c90891364710328f71ff62804618f4ff
  at: '2026-10-26T00:03:35+00:00'
  note: 'acc.r3-ops-runtime.score: python -m archi.ops.shadow produces the shadow report from the fixture
    history (merged in #810, test_shadow.py). acc.r3-ops-runtime.demote: in the lab, aging the jira source
    past its 24h limit drops a live L2 automation to shadow with "demoted to shadow: context gate failed:
    freshness:jira.jira" on the proposal; the demotion is written to archi_ops.demotions at once, and a
    second run with the source fresh again stays in shadow. Promotion: archi ops promote refuses without
    a passing shadow report, otherwise opens a PACT change in the instance repo with the report and
    thresholds and stops; the operator approves it with okg pact decide (archi never does); the runtime
    counts an automation live only when ops.yaml says live and that change is this automation''s newest
    promotion, approved after its last demotion. A hand-edited ops.yaml, an unapproved change, an
    unrelated or older approved change all leave it in shadow. Every automation starts in shadow.
    Who runs okg pact decide is not authenticated in okg 0.2.0 (ask O3, mitdbg/akmon#16).'
