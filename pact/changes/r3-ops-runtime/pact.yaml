  note: 'acc.r3-ops-runtime.halt: archi ops halt pauses the scanner, closes each open escalation (answered
    reject by archi ops halt), cancels non-final runs and writes halted decisions; an approved run held
    before its mediator step by a test-only gate ends halted with no marker, and the refusal comes from
    the mediator step; resume un-pauses the scanner and requeues the halted signal as attempt 2. archi
    ops status shows levels, budgets used against caps, pending escalations and shadow scores. Budgets:
    the per-run cap stops a run before escalation, and the per-day cap refuses the next run once spent
    (okg cost_budget scopes per automation and UTC day); the scanner runs one run per automation at a
    time. Known limit: halt with the worker down cannot write its halted records (ask O13, mitdbg/akmon#26).'
