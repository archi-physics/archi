pact_version: 5
id: cern-extra-sso-packages
title: archi declares the `cern` extra (requests-kerberos) that okg core is dropping
tier: 2
why: 'archi.downloaders.sso_login imports requests_kerberos at run time
  (sso_login.py:241) but archi declared no such dependency. It worked only because
  installs took okg[cern] from okg core, and cms-kb''s README tells operators to install
  exactly that. okg core (mitdbg/okg#3951) is removing its cern extra under the rule that
  CERN-specific install options belong in archi-okg. This change adds a `cern` extra here with requests-kerberos>=0.15 (the version okg used)
  and a quickstart paragraph. okg''s extra also listed cern-sso-python and jira. Nothing in
  archi imports cern-sso-python (git grep finds only the auth-preflight kind name
  cern_sso_http), and okg-deployments'' wisdqm download script only reads cookie-file
  environment variables, so it is not carried over. The `jira` client keeps its own
  existing extra. Nothing at run time changes; only where the package is declared moves.
  Unknown: whether requests-kerberos builds on a host without the Kerberos headers; the
  extra''s comment and the quickstart say the headers are needed (gssapi and krb5 build
  from source on Linux).'
affected_code:
- python/pyproject.toml
- python/tests/test_install_extras.py
- docs/cern-team-quickstart.md
requirements:
- id: req.cern-extra-sso-packages.declared
  statement: python/pyproject.toml has an optional `cern` extra naming exactly
    requests-kerberos, it is not a core dependency, and the extra resolves with pip.
tasks:
