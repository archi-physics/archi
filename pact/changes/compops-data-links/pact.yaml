requirements:
- id: req.compops-data-links.commit-ticket
  statement: 'A JIRA key in a commit message links the commit to the ticket.


    The cms_jira_key route also reads git_commit and makes a references edge at confidence 0.95;
    the narrowing git_commit references jira_issue allows it and is optional when either subtype
    is missing. The target is matched exactly by the existing alias backend: a key with no ticket
    in the graph makes no edge and stays an unresolved link_retry row.


    Acceptance:

    - acc.compops-data-links.commit-ticket.config: The shipped linker config routes cms_jira_key
    from git_commit and the shipped bridge carries the optional narrowing. [evidence: executed_test]

    - acc.compops-data-links.commit-ticket.publish: On a copy of the comp-ops pilot graph, a publish
    makes one git_commit references jira_issue edge per resolvable (commit, key) pair and none for
    a key with no ticket. [evidence: published_generation]'
- id: req.compops-data-links.twiki-link-urls
  statement: 'TwikiEOSSource can keep the URL of a labelled web link, and behaves identically to
    before when not asked.


    link_urls="keep" writes [[URL][label]] as "label (URL)" for http and https targets. Topic links
    and mailto links keep the label alone in both modes. The default "drop" leaves strip_twiki output
    and the change probe''s config hash unchanged, so a deployment that never sets the option does
    not re-ingest.


    Acceptance:

    - acc.compops-data-links.twiki-link-urls.default: With link_urls unset the existing twiki suite,
    including the cms byte-parity test, passes unchanged. [evidence: executed_test]

    - acc.compops-data-links.twiki-link-urls.keep: With link_urls="keep" a key that sits only in
    a link URL reaches chunk text. [evidence: executed_test]

    - acc.compops-data-links.twiki-link-urls.publish: On a copy of the comp-ops pilot graph, re-ingesting
    the TWiki snapshot with link_urls="keep" raises documentation_page-to-jira_issue reach to the
    corpus count of resolvable pairs. [evidence: published_generation]'
- id: req.compops-data-links.jira-fields-links
  statement: 'JIRA issues carry filterable fields and, on request, typed link edges.


    JiraIssue declares project, status, assignee and resolution as filterable text and created and
    updated as filterable timestamps; the issue node also carries resolution, labels and components
    (lists, display only). With issue_link_edges=True the source emits one jira_issue linked_to
    jira_issue edge per ordered pair of linked issues (issue links and sub-task parents), from the
    link''s outward side (the parent, for a child), with attrs link_kind (child, blocks, duplicates,
    clones, gantt or relates; the most specific when a pair is linked by several types) and link_type
    (the exact JIRA names, joined with "; "). The graph holds one edge per ordered pair, which is
    why several link types share one edge. A link is cached on both of its issues and is emitted
    once; a link to an issue outside the cache is not emitted. The cache keeps a link type''s name,
    not its outward wording, so the outward side of an instance-defined parent/child type is taken
    to be the parent; that holds for CERN JIRA''s Child-Issue and is stated in the reader. The option is off by default because the
    edge is a new output a strict output_signature must list.


    Acceptance:

    - acc.compops-data-links.jira-fields-links.default: With issue_link_edges unset no linked_to
    edge is emitted and the existing jira suite passes unchanged. [evidence: executed_test]

    - acc.compops-data-links.jira-fields-links.edges: With the option on, each linked pair becomes
    one directed edge with link_kind and link_type, in both cache shapes. [evidence:
    executed_test]

    - acc.compops-data-links.jira-fields-links.publish: On a copy of the comp-ops pilot graph, a
    re-ingest publishes the link edges and a created-date range filter returns issues. [evidence:
    published_generation]'
