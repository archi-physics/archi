  note: 'acc.r3-bundle-cms-physics.links: the cms-analyses pack (PAG/POG vocabulary, 180 public physics
    entities with alias matching, the declarative cross-link rules and the analysis-lookup playbook,
    lifted from cms-kb with cms_kb_* renamed cms_analyses_*) runs its real sources over a synthetic fixture
