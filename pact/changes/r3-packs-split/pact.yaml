  note: 'acc.r3-packs-split.validate, re-run at the PR head (the earlier heads were lost in a rebase):
    65 passed. An independent review found these limits, left as they are and disclosed: each
    coverage invariant requires a pack''s primary subtypes, not every subtype it emits (git_tag,
    code_import and similar can be legitimately empty); the invariants count subtypes over the
