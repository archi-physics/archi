pact_version: 5
id: twiki-eos-only
title: The cern-team bundle reads TWiki from an EOS dump only
tier: 2
why: >-
  The bundle shipped two TWiki readers: the EOS-dump reader and a live
  crawl. The crawl needs a CERN login even for public pages, because
  the topic source (`?raw=all`) redirects to the login. A short-lived
  branch tried an anonymous HTML fallback to get around that; it needed
  a second parser, and the two parsers would drift.

  Decision (Jason, maintainer, 2026-10-20): keep one
  TWiki parser and no anonymous HTML fallback. His words: "there is a
  twiki EOS dump we can use. we should only pull from this EOS dump".
  The anonymous branch is abandoned and none of its code is reused.

  So the cern-team bundle now has one TWiki path. The `twiki_crawl`
  source default and the questions that only it used (`twiki_base_url`,
  `twiki_seed_topic`, `twiki_max_depth`) are removed. One question,
  `twiki_eos_root`, names the dump directory and feeds the
  `twiki_eos` source's `eos_root`. `TwikiCrawlSource` stays in
  `python/archi/sources/twiki.py`: other repositories may use it, and
  connectors are kept line-comparable with the frozen canonical copies,
  so this change removes the bundle's use of it and not the class.
affected_code:
- bundles/cern-team/profile.yaml
- bundles/cern-team/README.md
- bundles/cern-team/source-defaults/twiki_eos.yaml.example
- bundles/cern-team/source-defaults/twiki_crawl.yaml.example
- docs/cern-team-quickstart.md
- python/tests/test_bundle_source_adapters.py
requirements:
- id: req.twiki-eos-only.single-path
  statement: >-
    Every TWiki source the cern-team bundle ships is `twiki_eos`. The
    bundle has no `twiki_crawl` default and its profile has no
    `twiki_base_url`, `twiki_seed_topic` or `twiki_max_depth`
    question.
- id: req.twiki-eos-only.root-answer
  statement: >-
    The `twiki_eos_root` install answer reaches the source byte for
    byte as `eos_root`, including a path with spaces, and the reader
    built from the resolved parameters emits the topics of the dump.
- id: req.twiki-eos-only.no-silent-shrink
  statement: >-
    A missing dump directory yields no facts and no completed-scope
    claim, so it cannot retract pages already ingested.
- id: req.twiki-eos-only.docs
  statement: >-
    Quickstart step 8 tells the reader to point `eos_root` at their
    dump, gives a count check and a search check, and no longer mentions
    a cookie, a login or a live crawl for TWiki, and it gives both the
    first-install route and the route for a deployment that already
    exists.
tasks:
- id: task.twiki-eos-only.bundle
  requirement: req.twiki-eos-only.single-path
  verification: >-
    test_twiki_in_the_bundle_is_the_eos_dump_reader_and_nothing_else
    passes, and the existing placeholder test confirms every `${...}`
    in source-defaults has an install question.
- id: task.twiki-eos-only.answer
  requirement: req.twiki-eos-only.root-answer
  verification: >-
    The parametrised test builds an install plan with okg's own
    build_plan, renames the example, answers twiki_eos_root, and runs
    the adapter over a synthetic two-topic dump; it expects exactly
    twiki:CMS:DemoHome and twiki:CMS:DemoTransfers.
- id: task.twiki-eos-only.missing
  requirement: req.twiki-eos-only.no-silent-shrink
  verification: >-
    test_the_twiki_eos_reader_refuses_a_missing_dump_instead_of_shrinking
    passes.
- id: task.twiki-eos-only.docs
  requirement: req.twiki-eos-only.docs
  verification: >-
    `grep -n -i -E "CERN_TWIKI_COOKIE|twiki_crawl|raw=all|TwikiCrawl|SSO"`
    on docs/cern-team-quickstart.md finds nothing, and step 8 gives the
    first-install route, the reinstall route, then ingest and run --once.
