pact_version: 5
id: catalog-downloaders
title: Downloaders for six cms-catalogs caches (CRIC, CRIC core, DBS, WMStats, GOCDB, CondDB)
tier: 2
why: 'Issue #903. Six cms-catalogs readers (cric, cric_core, dbs_datasets, wmstats_workflows,
  gocdb_downtimes, conddb_global_tags) read a local cache file that nothing in archi writes.
  docs/docs/reference/connector-caches.md lists them under "The eight without a downloader".
  Since the 2026-09 empty-cache-fails-loudly change, a missing or empty cache makes each reader
  report cache_missing and emit nothing, so a fresh cms-comp-ops install has no sites, storage
  or compute endpoints, datasets, workflows, downtimes or global tags. The earlier plan
  (compops-snapshot-builder) filled them from a private snapshot that is frozen at its
  collection date and not available to every operator.


  DECISION (operator, 2026-11-11): one standalone module per upstream, `python -m
  archi.downloaders.<name>`, like jira and cmssst; not wired as cms-catalogs prepare steps,
  so archi init is not blocked when no grid proxy is present.


  DECISION (operator, 2026-11-11): the DBS downloader fetches dataset metadata only, never
  files. By default it fetches the input and output datasets named in the WMStats cache;
  --pattern adds more.


  DECISION (operator, 2026-11-12): CondDB is skipped for now. Its web API is behind CERN SSO,
  and the anonymous route (Frontier, the conddb CLI''s own path) is plain HTTP with SQL in the
  URL; conddb_global_tags keeps reading whatever cache an operator places.


  DECISION (operator, 2026-11-13; replaces the one above): CondDB gets a downloader after all.
  It reads the CMS CondDB web browser (cms-conddb.cern.ch/cmsDbBrowser) through its read-only
  search, GET /search/Prod/<term>, authenticated with the CERN SSO session cookie that
  archi.downloaders.sso_login cms_conddb writes (Kerberos + TOTP, about 12 hours). The search
  answers at most 3000 rows, unordered and unpaged, so the downloader searches once per CMSSW
  major (CMSSW_<M>_, M 1-99) and per minor (CMSSW_<M>_<m>_, m 0-99) for a major that hits the
  limit, and fails when a per-minor search still hits it or a release does not read
  CMSSW_<major>_<minor>_... (on 16,390 real global tags every release does, in 45 series, the
  largest 1,142).


  DECISION (captain, 2026-11-12): one reader change. WMStatsWorkflowSource.cache_paths lists
  authority.json when it sits beside records.json, because the reader already opens it for the
  record-count check; the downloaders accept a staged file only when the reader lists it. An
  instance that has the file sees its stored content hash change once.


  NOT CHANGED: the other readers, their cache contracts and the snapshot builder. dqm and indico
  are out of scope. Reader gaps found on live data (GOCDB hosted_by is a GOCDB site name, not
  a CMS site; WMStats reads only the top-level InputDataset of chain requests) go to a
  separate issue.'
