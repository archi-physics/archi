requirements:
- id: req.catalog-downloaders.write
  statement: 'Each downloader writes exactly the files its reader reads, under ARCHI_DATA_ROOT
    (or an explicit output directory), atomically, and writes nothing when any fetch fails or
    the result is empty, and replaces a cache only after the real reader accepts the staged
    files (health ok and a complete scope). Credentials come from the environment or from a
    file an explicit flag names (--proxy); credential contents never appear in output, logs
    or the cache (a proxy file path may, so an error can say which file to renew).


    Acceptance:

    - acc.catalog-downloaders.roundtrip: for each of the six, a downloader run against recorded
    upstream answers produces a cache that the existing reader reads with health ok, a complete
    scope and the expected node count. [evidence: executed_test]

    - acc.catalog-downloaders.fail-closed: an HTTP error, a malformed answer or an empty result
    leaves the previous cache untouched and exits non-zero with a message naming the endpoint.
    [evidence: executed_test]'
- id: req.catalog-downloaders.auth
  statement: 'CMS CRIC, DBS and WMStats authenticate with a grid proxy: the file --proxy names,
    else X509_USER_PROXY, else /tmp/x509up_u<uid> (CMS CRIC needs it because its facility and
    site-responsibilities endpoints redirect an anonymous request to a login page). A missing or
    expired proxy stops the run before any request, with a message that names voms-proxy-init.
    WLCG CRIC core and GOCDB need no credential.


    Acceptance:

    - acc.catalog-downloaders.proxy: a missing proxy and an expired proxy each stop the run
    with no request made. [evidence: executed_test]'
- id: req.catalog-downloaders.dbs-scope
  statement: 'The DBS downloader fetches dataset metadata only. With no flag it fetches the
    input and output datasets named in the WMStats cache; --pattern adds datasets matching a
    DBS pattern. It never fetches files.


    Acceptance:

    - acc.catalog-downloaders.dbs-scope: the dataset set requested equals the WMStats-named
    datasets plus the pattern matches, each once. [evidence: executed_test]'
- id: req.catalog-downloaders.conddb
  statement: 'The CondDB downloader lists every global tag through the CondDB browser''s search
    GET and no other route, authenticated with the CERN SSO cookie file (--cookie-file, else
    CONDDB_COOKIE_FILE, else cms_conddb.txt where sso_login writes it). A missing, unreadable or
    expired cookie file stops the run before any request; a redirect or a login page fails the
    run with the sso_login command. It writes nothing when a search it relies on may be cut
    short by the 3000-row limit, when a release breaks the CMSSW_<major>_<minor>_ form the
    listing relies on, when one name comes back with two different rows, or when the page''s
    gts table drifts (headers, row shape, an unknown Type, a time format).


    Acceptance:

    - acc.catalog-downloaders.conddb-complete: a capped major is searched per minor and every
    global tag reaches the reader; a per-minor search at the limit, a non-CMSSW release, a
    conflicting duplicate and each page drift exit 1 with the old cache untouched.
    [evidence: executed_test]

    - acc.catalog-downloaders.conddb-auth: a missing or expired cookie file makes no request; a
    redirect to the CERN login page fails naming sso_login. [evidence: executed_test]'
- id: req.catalog-downloaders.docs
  statement: 'connector-caches.md moves the six readers to "The ones that do have tooling" with
    each command, credential and upstream; the cms-comp-ops README names the commands.


    Acceptance:

    - acc.catalog-downloaders.docs: the docs name every new module and its credential.
    [evidence: review]'
