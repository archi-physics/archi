    main both point at 011f5d64 (archi #764: a merge, not a force-push), and git diff
    archi-okg/main archi/archi_v3 is empty. The old tip 09299e4e is tag archi_v3-pre-merge.
    git log --no-merges archi-okg/main..archi_v3-pre-merge is now empty; the 011f5d64 commit
    message records what was carried over (the 3.0 plan and approvals) and what was superseded
    (the deploy-key CI, 54219413 and 41863a7e).'
- kind: manual
