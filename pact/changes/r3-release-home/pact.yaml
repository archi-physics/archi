pact_version: 5
id: r3-release-home
title: Make archi-physics/archi the home of the v3 line; publish as archi-kb
tier: 2
why: 'The v3 distribution is developed in archi-physics/archi-okg (main), while archi-physics/archi
  still carries a stale archi_v3 (tip 7e15f35, PR #654) that diverged from it, plus the live
  v2 main. The release, the docs URL and the name recognition are on archi. The PyPI name
  archi belongs to an unrelated package, so the quickstart installs from a git URL. ADR 0002
  D1/D2.'
affected_code:
- python/pyproject.toml
- AGENTS.md
- CLAUDE.md
- pact/project.yaml
- .github/workflows/
- README.md
- docs/okg-alignment.md
requirements:
- id: req.r3-release-home.home
  statement: 'archi-physics/archi archi_v3 equals archi-okg main (history preserved), the
    previous archi_v3 tip is kept as tag archi_v3-pre-merge, and any commit on it not already
    in archi-okg is either carried over or listed as dropped with a reason.


    Acceptance:

    - acc.r3-release-home.parity: git diff archi-okg/main archi/archi_v3 is empty after the
    merge. [evidence: manual]'
- id: req.r3-release-home.rules
  statement: 'Working rules (AGENTS.md, CLAUDE.md, pact/project.yaml pr_policy) agree on where
    PRs land.


    Acceptance:

    - acc.r3-release-home.rules: AGENTS.md, CLAUDE.md and pact/project.yaml name the same
    PR base. [evidence: manual]'
- id: req.r3-release-home.dist
  statement: 'The wheel''s distribution name is archi-kb, import name archi; a trusted-publishing
    workflow publishes tagged releases to PyPI; `pip install archi-kb` provides `import archi`
    and the archi CLI.


    Acceptance:

    - acc.r3-release-home.name: pyproject declares name = archi-kb; packaging test green.
    [evidence: pytest]

    - acc.r3-release-home.pypi: a 3.0.0a pre-release installs from PyPI in a clean venv. [evidence:
    manual]'
- id: req.r3-release-home.archive
  statement: 'archi-physics/archi-okg is archived with a README pointing at archi; open PRs
    and issues there are moved or closed with a link.


    Acceptance:

    - acc.r3-release-home.archived: the repo shows as archived; README redirect merged. [evidence:
    manual]'
tasks:
- id: task.r3-release-home.merge-lines
  requirement: req.r3-release-home.home
  verification: 'Replace archi_v3 with archi-okg main after tagging the old tip; audit the
    divergent commits.


    Test plan:

    - git log archi_v3-pre-merge --not archi-okg/main reviewed [evidence: manual]'
- id: task.r3-release-home.rules
  requirement: req.r3-release-home.rules
  verification: 'Edit the three rule files together.


    Test plan:

    - diff review [evidence: manual]'
- id: task.r3-release-home.dist-name
  requirement: req.r3-release-home.dist
  verification: 'Rename the distribution; keep the import name.


    Test plan:

    - python/tests/test_packaging.py [evidence: pytest]'
- id: task.r3-release-home.publish
  requirement: req.r3-release-home.dist
  verification: 'Add the release workflow with PyPI trusted publishing.


    Test plan:

    - pre-release install in a clean venv [evidence: manual]'
- id: task.r3-release-home.archive-okg
  requirement: req.r3-release-home.archive
  verification: 'Archive archi-okg after the merge lands.


    Test plan:

    - repo settings screenshot or API output [evidence: manual]'
evidence:
