requirements:
- id: req.ws-indico-contributions.records
  statement: 'With `contributions: true`, every contribution of an event is its own
    meeting_minutes record, linked from the event by a contains edge.


    A record carries title, speakers (with affiliations in its text), session, start and
    end time, abstract, its own Indico URL, and attachment names and URLs. Attachment text
    is not fetched. The timetable fallback produces the same records. The event record no
    longer repeats the talks'' text.


    Acceptance:

    - acc.ws-indico-contributions.records: Against saved export fixtures for event 1716863,
    the contributions endpoint turns four talks into four linked records with the fields
    above, and the timetable fixture (two scheduled talks) turns into two. A failed
    contributions or timetable request makes the event a failed event with no complete
    scope. [evidence: executed_test]'
- id: req.ws-indico-contributions.off
  statement: 'With the option off (the default) the connector emits exactly what it did
    before: one record per event, talks inline in its text, no edges.


    Acceptance:

    - acc.ws-indico-contributions.off: The existing suite passes unchanged and a new test
    shows no edges and talk text still inline. [evidence: executed_test]'
