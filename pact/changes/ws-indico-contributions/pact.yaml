pact_version: 5
id: ws-indico-contributions
title: One searchable record per Indico talk, linked to its event
tier: 2
why: 'The live Indico source turns an event into ONE meeting_minutes record. For the public
  workshop event 1716863 that is a single ~56 KB record with no links: every talk, speaker
  and session is flattened into its text, so an agent can cite the meeting but not a
  talk, a speaker or a session.


  The data is already read. The source calls /export/event/<id>.json?detail=contributions
  (and the timetable export when that is empty) and then throws the structure away.
  The anonymous export carries, per talk: title, abstract, speakers with affiliations,
  session name, start and end time, its own URL, and attachment names and URLs.


  Reuses the existing meeting_minutes subtype (described as "Indico meeting/event notes")
  for a talk, with event_type "contribution". The only new schema item is one narrowing,
  meeting_minutes_contains_meeting_minutes, declared the way the other meeting_minutes
  edges are (bridges/operations.yaml, mirrored in the cern-team bundle). The cache-backed
  source (indico.py) has no contribution record shape, so nothing existing is reused or
  duplicated there.


  OPTION, OFF BY DEFAULT: `contributions: true`. Turning it on adds records and shortens
  the event record (it stops repeating every talk), so a current user''s graph would change
  without it. Off, the output is byte-for-byte what it was.


  Interaction with archi-okg#29 (token + since): that PR edits __init__, _session,
  preflight and _event_ids_in_scope; this one edits __init__ (one new keyword and one
  probe-config key), the harvest, the facts generator and the record builder. Different
  hunks; the only textual neighbours are the __init__ signature and the change_probe
  config dict, which merge by keeping both lines. The two features are independent: a
  token or date window decides WHICH events are read, this decides how each is emitted.'
