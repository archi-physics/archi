pact_version: 5
id: cmssst-site-status
title: 'A CMS Site Support Team site-status source: one citable page per site'
tier: 2
why: 'Benchmark question q008 cites the CMS Site Support Team (CMS SST) site status page https://cmssst.web.cern.ch/siteStatus/detail.html?site=<SITE>
  as its gold source. No archi source reads that page, so the graph cannot hold or cite it
  and an agent cannot answer from it. Jason decision `s6src A` (2026-10-07): add a comp-ops
  source for the current CMS SST site status, current state only, no history.


  MEASURED BEFORE DESIGNING (samples fetched 2026-10-07): the detail page is an empty shell
  that loads https://cmssst.web.cern.ch/siteStatus/data/<SITE>.json (public, no login, about
  190 KB, refreshed every 900 s). The site list is the JavaScript file data/summary.js (`var
  siteStatusData = [ { site: "T0_CH_CERN", ...}, ...]`, 91 sites). Each site JSON holds a
  snapshot time, GGUS tickets as [ticket id, opened epoch] pairs, 18 site-level metrics (LifeStatus,
  ProdStatus, CrabStatus, RucioStatus, their manual overrides, SiteReadiness, SAMsite, FTSsite,
  HammerCloud, Downtime, Summary and the 1-day variants), each a set of time bins (pmonth,
  pweek, yesterday, today, fweek) of one-letter status codes, plus a large per-host `elements`
  list. The letters have no text meaning in the data: the page''s renderer, detail_lib.js,
  maps each to a colour, and detail.html''s legend names the colours. The decoding here is
  read off those two files.


  SHAPE: follow the cache-backed pattern (gocdb): a downloader writes data/cmssst-site-status/records.json,
  a reader turns it into facts, a snapshot GroupSpec packs it. Facts reuse the existing documentation_page
  and document_chunk subtypes (no schema change), with the detail URL as the page url so a
  retrieved passage cites the gold page. The only site link is the existing narrowing documentation_page_references_site
  (archi/schemas/bridges/operations.yaml), emitted only to sites a configured CRIC sites cache
  proves exist.'
