pact_version: 5
id: reference-catalog-complete-scope
title: Reference-catalog readers are no longer refused under okg's release run modes
tier: 2
why: 'okg commit d84f8fd275 ("Resolve source run modes from one per-profile policy", 2026-09-26,
  contained in the pinned ac078aabd) runs every `source_class: reference_catalog` source in
  run mode `release_new`, which it picks automatically; `release_unchanged` comes only from
  an explicit mode setting. Both complete the scope in okg''s table (src/okg/substrate/source_run_modes.py).
  The four archi reference-catalog readers -- cmssw, conddb, dbs and github_repos -- decided
  the claim with their own copy of the mode set, `{"scope_complete", "reconcile"}`, and returned
  no cursor. So they never claimed a complete scope, and okg admission refused every later
  run that emitted nothing new as `partial` (zero_output_admission.py: an incomplete run is
  accepted as a no-op only for a source with a stored cursor or reconcile time), which blocked
  publishing. A downstream CMS instance turned its CMSSW releases source off on 2026-10-01
  because of it.

  DECISIONS. Jason, `cmsswfix A`, refined after review (10-05):

  - cmssw and github_repos claim a complete scope in okg''s scope-completing modes, release
  modes included. Deletion by absence is live for them (deletion_semantics missing_from_completed_scope).
  It was impossible before: until d84f8fd275 such a retraction failed the run (no runner policy
  for reference_catalog under scope_complete), and since then they never claimed a complete
  scope. github_repos withholds the claim when no slug is valid (`and bool(records)`, as cmssw),
  and refuses an explicit empty `repos: []` with ValueError; a missing `repos` keeps the defaults.

  - dbs and conddb claim NO complete scope in release_new or release_unchanged, so they never
  delete by absence: a narrower cache export would retract an unbounded share of the catalog,
  and okg has no retraction-size guard yet (mitdbg/okg#3307). In those modes they return a
  cursor, `input_content_sha256`, the SHA-256 of the bytes of the input caches (conddb also
  the CMSSW cache it reads), so okg accepts an unchanged rerun as `incomplete_scope_noop`.
  okg never skips a read for these readers (none declares probe_short_circuit_safe), so every
  run re-reads the cache in full; the cursor only gives the source stored state. Costs: only
  a completed scope advances last_reconcile, so dbs and conddb read as stale in freshness
  checks; and okg refuses scope_complete and reconcile for a reference_catalog source at run
  start (runner.py@ac078aabd:2982-2996), so under current okg no run removes records that
  leave the export until okg#3307 lands and these sources switch to deleting. At reader level
  scope_complete, reconcile and every other mode behave as on main.

  KNOWN LIMIT under an okg without mitdbg/okg#3317 (round-3 review finding 1; Jason, `stuck
  A`): a deployment where dbs or conddb already published facts without a cursor (the state
  the old bug leaves) is refused `partial` on the first run after this fix, because every
  fact dedupes and the cursor is stored only on an accepted run. okg#3317 fixes it in okg:
  a prior accepted and published admission of the source counts as history, so that first
  unchanged rerun is accepted as `incomplete_scope_noop`, with no deletion and no blocked
  publish. It applies once the instance''s okg includes #3317; no archi code change. Fresh
  deployments and sources that never published are unaffected either way.

  - The modes live in one archi module, archi.sources._run_modes (COMPLETED_SCOPE_RUN_MODES
  and RELEASE_RUN_MODES), not an import of okg.substrate.source_run_modes: `okg lint deployments`
  reports DEPLOYMENT-001 for any okg.substrate import in a connector, and okg-deployments''
  compatibility CI marks such a deployment incompatible. A test holds both sets equal to okg''s
  (from okg.deployment when the pinned okg exports COMPLETED_SCOPE_RUN_MODES, else okg.substrate).
  Readers should import the okg.deployment export once the pin passes okg branch claude/connector-complete-scope-modes.
  The okg pin does not change. The admission accept path itself is tested on the okg side;
  archi has no database fixture.

  NOT CHANGED: the other readers with the same hard-coded set are discovery_crawl (cds, cric,
  docs, dqm, gocdb, hypernews, indico, indico_live, siteconf, twiki) or mutable_api (jira,
  monit, wmstats). okg''s completing modes for those profiles are scope_complete and reconcile,
  which the hard-coded set already covers.'
