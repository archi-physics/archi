requirements:
- id: req.reference-catalog-complete-scope.deleting-catalogs
  statement: cmssw and github_repos claim a complete scope over a valid input in `release_new`
    and `release_unchanged`, and claim none in `cursor`.
- id: req.reference-catalog-complete-scope.non-deleting-catalogs
  statement: 'dbs and conddb claim no complete scope in `release_new` or `release_unchanged`
    and return a checkpoint whose cursor is a SHA-256 of their input content: equal for unchanged
    input, different when a cache changes (for conddb, either cache). At reader level, `scope_complete`
    and `reconcile` claim the scope and return no checkpoint, as on main (okg does not currently
    run a reference_catalog source in either mode); in `cursor` they claim nothing.'
- id: req.reference-catalog-complete-scope.guards-kept
  statement: 'In the release modes the guards withhold the claim: skipped cache items (cmssw,
    conddb, dbs), an empty cache (cmssw, conddb, dbs), a truncated release list (cmssw), and
    no valid repository slug (github_repos). github_repos refuses an explicit empty `repos`
    list and keeps the defaults when `repos` is missing.'
- id: req.reference-catalog-complete-scope.okg-parity
  statement: No connector imports okg.substrate; archi's COMPLETED_SCOPE_RUN_MODES and RELEASE_RUN_MODES
    equal okg's sets at the pinned okg commit, checked by a test.
- id: req.reference-catalog-complete-scope.alignment
  statement: docs/okg-alignment.md records the change in "Current state" (which sources delete
    by absence, which do not and why, the staleness cost, the planned switch to the okg.deployment
    export) and lists okg.deployment Checkpoint in its import block; test_alignment_page.py
    passes.
