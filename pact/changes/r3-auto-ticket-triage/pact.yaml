  head: abb32022ebc482aa8de5a6d8b3527f80fe76622d
  at: '2026-10-31T16:46:29+00:00'
  note: 'acc.r3-auto-ticket-triage.fixture, after the #746 fixes and two more adversarial reviews: on a real
    okg 0.2.0 worker (archi init cluster-manager --with servicenow,jira,ticket-triage, fixture caches, a fake
    Redmine/JIRA/ServiceNow API on a loopback port) the scanner sets a cursor per source on its first read
    (no backlog); three arriving tickets each become one signal and a shadow run whose draft cites the ticket
    and its related tickets by node id. Promoted, L1 drafts and sends nothing. L2 proposes an assignment;
    approved, the live tool re-checks the approval, writes only to the endpoint ops.yaml configures and only
    for a ticket whose link lies under it, assigns once and notes the escalation on the ticket. Rejected,
    timed-out (a late approval refused) and halted runs never reach the ticket system; L3 is refused citing
    D13. After archi init, a queued ingest and a queued publish run on the worker and publish a new
    generation. Lab: 39 checks, all pass, at 6b7f6c63 (before the
    merge of archi_v3 55931da9 and a test-only fix). Full suite at this head: 3954 passed, 2 skipped, 0
    failed. The four-week shadow (req.r3-auto-ticket-triage.shadow) is not evidenced here; what 3.0 does
    about it waits on board d717.'
