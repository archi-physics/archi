pact_version: 5
id: r3-bundle-companions
title: 'Bundles can name companion packs; cms-comp-ops brings code-text whenever git-code is selected'
tier: 2
why: 'Decision d716 (Jason, 2026-10-31): the text of every repository file should be in a comp-ops
  graph by default wherever git-code is used. code-text requires git-code, so listing code-text as
  a cms-comp-ops default would also force git-code, whose repository URL has no default, and every
  comp-ops install would fail without `--git-code-repo-url`. The coordinator ruled that out as an
  unapproved regression. The bundle format had only unconditional default and optional lists, and
  a pack''s `requires` points the other way.


  This change amends ADR 0002 section 3.3 (the composition formula) with companion packs: a
  bundle may name `packs.companions: {<pack>: [<companion>, ...]}`, and whenever `<pack>` is
  selected (by default or with `--with`), each companion is added with the packs it requires,
  unless the companion or its trigger is given to `--without`. The formula becomes
  `packs = companions(closure(requires, ∪ default(extends*(A, B, ...))) ∪ with) − without`.
  `--without` may name any companion the bundles declare, selected or not, so an opt-out can be
  recorded before its trigger is added. cms-comp-ops names `git-code: [code-text]` and lists
  git-code as optional. An install without git-code is unchanged; with git-code it gets code-text
  (the pack change is r3-code-text-all-files, which this one follows); `--without code-text` opts
  out. `archi add git-code` re-renders through the same resolver, so it brings code-text too.'
