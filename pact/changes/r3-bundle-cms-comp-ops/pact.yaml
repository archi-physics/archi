decisions:
- digest: sha256:a173ac394caa47c8ccd6025a46760c8ec2d1b3c60056526a48f5a5678474a91b
  reviewer: Jason Mohoney
  at: '2026-10-27'
  note: 'Jason, board d380 Q6: ''Record it; drop #748 from 3.0''. #748 (the four-week comp-ops
    shadow) leaves 3.0; the comp-ops bundle itself merged in #849 and stays.'
- digest: sha256:a173ac394caa47c8ccd6025a46760c8ec2d1b3c60056526a48f5a5678474a91b
  reviewer: Jason Mohoney
  at: '2026-10-27'
  note: 'acc.r3-bundle-cms-comp-ops.install reworded. Board d380 Q7, Jason: "Yes", relayed as
    covering #733, #739 and #724 (this bundle is #724). A
    bundle CI job becomes an install-and-publish test (test_pack_isolation) plus a lab smoke
    run. No bundle CI job exists because board d332 deferred the CI gate on bundle changes to
    the #619 eval framework. The lab smoke run is moot for this bundle under d380 Q6, which
    leaves it no smoke-eval set in 3.0, so the install-and-publish test alone applies.'
