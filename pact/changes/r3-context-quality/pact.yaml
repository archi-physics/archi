  head: 70e84a739c8386ca890f2bfdabbe103bc33deb92
  at: '2026-10-27T03:01:44+00:00'
  note: 'Fixture tests only. acc.r3-context-quality.run (a context eval on the comp-ops instance producing
    a report with the baseline arm) is NOT done: it waits on access to that instance and on the operator
