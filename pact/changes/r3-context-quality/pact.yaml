    ARCHI_CONTEXT_EVAL_QUESTIONS); a missing path exits 2 naming it. Results: 141 passed in the evaluation,
    gate and health-signal tests; full suite 3484 passed, 27 skipped. Both ran at 1853f7d5 with cli.md
    regenerated, a tree identical to this head.'
