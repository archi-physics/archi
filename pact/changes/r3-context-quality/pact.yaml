decisions:
- digest: sha256:2b644e2b8e11d4be069b07ce5d888e78f5eb461414d8853dfc7aa1f1516834a2
  reviewer: Jason Mohoney
  at: '2026-10-27'
  note: 'The comp-ops operator top-50 named in req.r3-context-quality.context-eval and #698 is
    superseded by CompOps-42, the okg comp-ops benchmark bundle, with its corrected answer key v1
    (board d373). Board d406, Jason: "isn''t this the comp ops benchmark we have with 42 questions?";
    orchestrator decision. The requirement statement is kept as written; this row records which set
    it now means. CompOps-42 names its evidence in prose (sources, verification evidence, per-atom
    answer_source), not as node ids, so its gold_sources are drafted with python -m
    archi.evaluation.draft_gold_sources and reviewed once by the person who built key v1 before the
    run; atoms answered only by a live system (live_rucio, live_dbs, monitoring) are unavailable in
    both agent arms. The set and the draft are private to the instance and are not in this
    repository. Preconditions for acc.r3-context-quality.run: the jira pack and git-code (multi-repo)
    on the comp-ops instance (#726). This row proves nothing: req.r3-context-quality.context-eval
    stays unproven until the comp-ops run.'
