- docs/
requirements:
- id: req.r3-301-akmon-040.okg040
  statement: 'archi runs on AKMON okg 0.4.0: CI, the nightly and every install page
    install the 0.4.0 wheel pinned by sha256; the bundles declare okg >=0.4.0,<0.5; the
    alignment page names 0.4.0; the full suite passes on 0.4.0.


    Acceptance:

    - acc.r3-301-akmon-040.suite: python -m pytest python/tests on okg 0.4.0 passes. [evidence: pytest]

    - acc.r3-301-akmon-040.e2e: the empty-machine path (init, up, doctor) passes on 0.4.0. [evidence: executed_test]'
- id: req.r3-301-akmon-040.doctext
  statement: 'A profile that selects a source module archi knows creates doc: text
    records (archi.sources.code_text, archi.sources.indico) sets mcp.doc_text_nodes:
    true; other profiles leave the key out.


    Acceptance:

    - acc.r3-301-akmon-040.doctext: a compose test renders both cases. [evidence: pytest]'
- id: req.r3-301-akmon-040.names
  statement: 'archi init refuses an instance name okg chat sync would refuse (anything
    outside a lowercase letter followed by lowercase letters, digits and -), before it
    creates anything.


    Acceptance:

    - acc.r3-301-akmon-040.names: an init test refuses my_team and accepts my-team. [evidence: pytest]'
- id: req.r3-301-akmon-040.release
  statement: 'Version 3.0.1 with release notes; release-notes links name their own tag,
    never main, enforced by a test.


    Acceptance:

    - acc.r3-301-akmon-040.links: test_package_metadata checks every release-notes file. [evidence: pytest]'
