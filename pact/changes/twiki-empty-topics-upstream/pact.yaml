pact_version: 5
id: twiki-empty-topics-upstream
title: A few empty TWiki topics no longer refuse the whole snapshot
tier: 2
why: 'Release risk found by a real run. The empty-cache-fails-loudly rule (PR #21) read every
  zero-byte, whitespace-only or NUL-only TWiki topic file as an interrupted sync: the file was
  skipped and the run claimed no complete scope (health endpoint_failed). The real CMS snapshot
  holds two topics that are empty upstream (twiki-cms/ExperienceFromFirstCollisions.txt, mtime
  2010-01-14, and twiki-cms/TWikiTopQuarkTtXAnalyses.txt, mtime 2025-09-01), so every full cms-kb
  ingest was refused and its publish skipped. The snapshot builder refused the twiki-eos group for
  the same reason, so a release snapshot needed a hand-staged copy without the two files.


  DECISION (lead, 2026-09-29): a topic that is empty upstream is correctly absent, and a complete
  scope retracts it; an interrupted sync leaves many empty files. Empty topic files are skipped
  (never emitted: that would blank the page), counted and named in the health reason and in
  TwikiEOSSource.last_empty_topics, and the run still claims its scope with health ok, unless
  there are more than max(10, 0.1% of the topic files read, empty ones included). Above that the
  refusal stays (endpoint_failed, no complete scope). A snapshot of only empty topics stays
  cache_missing; every other #21 rule is unchanged. preflight() reaches the same verdict as run().


  DECISION (orchestrator, 2026-09-29): the snapshot builder leaves empty twiki-eos topic files out
  of the archive and records them in the lock (empty_topic_files, a count, and empty_topic_names).
  The same threshold refuses the group, and so does a tree of only empty files. verify checks that
  the count matches the names and that no named file is archived.'
