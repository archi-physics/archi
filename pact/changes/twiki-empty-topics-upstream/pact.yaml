- python/archi/snapshot/groups.py
- docs/cache-snapshot.md
- python/tests/sources/test_twiki.py
- python/tests/snapshot/test_snapshot_builder.py
requirements:
- id: req.twiki-empty-topics-upstream.reader
  statement: 'The TWiki EOS reader skips empty topic files and still claims its scope when
    there are at most max(10, 0.1% of topic files) of them.


    Acceptance:

    - acc.twiki-empty-topics-upstream.few: two empty topics among many are not emitted, both are
    named in the health reason, health is ok and the scope is complete, in run() and preflight();
    the same holds for a seeded walk and for whitespace-only and NUL-only files. [evidence: executed_test]

    - acc.twiki-empty-topics-upstream.many: more empty topics than the limit give endpoint_failed
    and no complete scope, with preflight() giving the same reason; a snapshot of only empty topics
    stays cache_missing. [evidence: executed_test]

    - acc.twiki-empty-topics-upstream.real: on the real Aug 31 twiki-eos snapshot the patched reader
    reports ok, a complete scope and 43,744 topics, and names the two empty files. [evidence: executed_test]'
- id: req.twiki-empty-topics-upstream.snapshot
  statement: 'The snapshot builder leaves empty twiki-eos topic files out, lists them in the lock,
    and refuses the group above the same limit.


    Acceptance:

    - acc.twiki-empty-topics-upstream.lock: a fake snapshot with 2 empty topics among many builds;
    the lock shows empty_topic_files 2 and names both; the archive holds neither; verify is ok.
    [evidence: executed_test]

    - acc.twiki-empty-topics-upstream.refuse: 11 empty among 13 text files, or a tree of only empty
    files, refuses the group and writes nothing; verify fails a lock whose count or names disagree
    with the archive. [evidence: executed_test]'
tasks:
- id: task.twiki-empty-topics-upstream.reader
  requirement: req.twiki-empty-topics-upstream.reader
  verification: 'Apply the threshold in the shared preflight/run verdict; rewrite the tests
    that asserted any empty topic refuses the scope; add the few, at-the-limit, many and
    limit-arithmetic cases with fake data.


    Proof: the full archi suite passes on a dev host; the patched reader, run read-only on the
    real Aug 31 snapshot on a dev host, reports ok, complete scope, 43,744 topics and the two names.


    Test plan:

    - python/tests [evidence: pytest]'
- id: task.twiki-empty-topics-upstream.snapshot
  requirement: req.twiki-empty-topics-upstream.snapshot
  verification: 'Skip blank text files for twiki-eos in the builder, record them in the lock,
    apply the threshold, check the rows in verify; test with small fake snapshot builds.


    Test plan:

    - python/tests/snapshot [evidence: pytest]'
