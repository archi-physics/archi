pact_version: 5
id: catalog-handle-fields
title: Archi types declare their catalog title and date fields
tier: 2
why: 'okg read model slice 1 (mitdbg/okg#3192) shows each record with a title and its creation
  and last-modified dates, read from the attribute a class names in `okg_title_from`, `okg_created_at_from`
  and `okg_last_modified_at_from`. No archi type declared them, so comp-ops records had no
  title or dates in that view. This change declares a title on 23 archi types and three dates
  (JiraIssue created and updated, Workflow created_at), each an attribute that a read-only
  check found 100% populated on the comp-ops graph. The dates are internal, unmasked creation
  and update dates: no archi type declares pii_classes and every cms source is classified
  internal.'
affected_code:
- python/archi/schemas/operations.yaml
- python/archi/schemas/sources.yaml
- bundles/cern-team/schemas/operations.yaml
- bundles/cern-team/schemas/sources.yaml
- python/tests/test_catalog_handle_fields.py
requirements:
- id: req.catalog-handle-fields.declared
  statement: Exactly 26 declarations are present (23 okg_title_from, two okg_created_at_from,
    one okg_last_modified_at_from), each naming an attribute of its own class, in both the
    package schemas and the byte-identical cern-team bundle copy.
- id: req.catalog-handle-fields.composes
  statement: The installed cms deployment with these schemas composes with no refusal under
    okg a8fcfca0fe and 360a1724e4, and the composed catalog carries every declaration as subtype
    metadata.
tasks:
- id: task.catalog-handle-fields.declared
  requirement: req.catalog-handle-fields.declared
  verification: python/tests/test_catalog_handle_fields.py pins the exact set, checks every
    name against its class's attributes and shows a misspelt name is caught; test_bundle_cern_team.py
    keeps the bundle copy byte-identical; the full suite passes.
- id: task.catalog-handle-fields.composes
  requirement: req.catalog-handle-fields.composes
  verification: test_composer_reads_every_declaration passes under okg a8fcfca0fe and 360a1724e4,
    and compose_catalog on a copy of the installed cms deployment with the branch schemas
    returns every declaration under both.
