pact_version: 5
id: twiki-physics-filter
title: Opt-in physics scoping for the TWiki EOS connector
tier: 2
why: 'cms-kb forked the whole twiki_eos connector (982 lines, src/cms_kb/twiki.py at okg d259d0df)
  to add four physics filter stages on top of it. archi ships the maintained descendant of that same
  connector. Two readers of one corpus is the duplication the cms-kb composition-root restructure
  (cms-kb pact cms-kb-composition-root) exists to remove, and the fork is pinned to an okg API that
  no longer exists on dev, so it cannot simply be carried forward.


  This lands the four stages here as an OPT-IN, NON-DEFAULT option on TwikiEOSSource, so the fork
  can be deleted. Off is the default and off is a no-op: every existing archi consumer, cern-team
  bundle included, ingests exactly what it ingested before.


  SCOPE: selection only. The filter never adds, renames or narrows a subtype, so it carries no ontology
  risk. CMS-physics vocabulary -- the PAG/POG hub nodes and their subtypes -- stays in cms-kb, which
  is the deployment that wants it.


  CARRIED LIMITATION, asserted in a test rather than silently fixed: the parent-topic closure matches
  bare topic names, so a web-qualified TOPICPARENT (CMS.HiggsPhysics) does not close a chain. The
  production CMS snapshot records bare names. Fixing it would change which pages a cms-kb build ingests,
  which belongs in its own change with a diffed page count, not in a port whose point is parity.


  MEASURED COST, recorded rather than left for the next operator to discover: the filter runs over
  already-parsed records, so a physics-scoped run reads and parses the entire snapshot before discarding
  most of it. On the CMS mirror (43.5k topics on Ceph) that read is the whole cost of the ingest
  -- hours, unchanged from an unfiltered run. The stages cannot simply move to path level: stage
  3 needs each topic''s %META:TOPICPARENT to know whether its chain reaches a seed, which means opening
  the file. What WOULD work is a two-pass read -- header bytes only for the closure, full body only
  for keepers -- and that is its own change, with its own before/after timing, not a silent tweak
  to this one.'
