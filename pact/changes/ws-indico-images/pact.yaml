pact_version: 5
id: ws-indico-images
title: Indico talk attachments that okg can render become viewable images
tier: 2
why: 'With `contributions: true` each Indico talk is its own record and lists its
  attachment names and URLs, but an agent can only read those names. It cannot look
  at a talk''s slides.


  okg already has the whole image path: a node attr tagged `okg_image` (kind `url`)
  is fetched when an agent calls `inspect(kind="image")`, rendered (a PDF shows page
  1) and returned as an image. No source emitted such a value. This change makes the
  live Indico source emit one for each PDF, PNG or JPEG attachment of a talk. Nothing
  is downloaded or stored at ingest, and no model is called.


  OPTION, OFF BY DEFAULT: `attachment_images: true`, which needs `contributions: true`
  (the images sit on the talk records). `max_images_per_talk` (default 3) and
  `max_image_bytes` (default 10 MiB, okg''s own URL limit) bound it. Slide decks
  (pptx), links, protected attachments and oversized files get no image value and
  stay names and URLs.


  The deployment must also allow the host: okg fetches nothing unless
  `agent_surface.images.url.prefixes` lists it, and serves the image kind only when
  an `agent_surface` block exists. A bundle default cannot be switched on by a source
  option, and an `agent_surface` block needs a `served` list that would redefine the
  tool surface of every install, so the bundle documents the block in
  indico_live.yaml.example and the quickstart instead of shipping it.'
affected_code:
- python/archi/sources/indico_live.py
- python/tests/sources/test_indico_live.py
- bundles/cern-team/source-defaults/indico_live.yaml.example
- docs/cern-team-quickstart.md
- docs/okg-alignment.md
- skills/indico.md
requirements:
- id: req.ws-indico-images.values
  statement: 'With `contributions: true` and `attachment_images: true`, a talk record
    carries attr `attachment_images`: one `{"okg_image": "url", "url": ...}` value
    (built with okg''s `ImageRef.url`) per PDF, PNG or JPEG attachment, at most
    `max_images_per_talk`.


    Attachments of type pptx or any other type, link entries, protected attachments
    and files larger than `max_image_bytes` get none; they stay in `attachment_names`
    and `attachment_urls`. The timetable export names no content type, so the file
    extension decides there.


    Acceptance:

    - acc.ws-indico-images.values: Against the saved export fixture for event
    1716863 with png, jpg, pdf and pptx attachments added, the talk carries image
    values for the pdf, png and jpg and none for the pptx; the cap is respected;
    protected (attachment or folder), oversized and non-file entries are skipped; a URL
    okg refuses (`..`, `%5c`, `@` in the host) is skipped and counted, and the run still
    completes. [evidence: executed_test]

    - acc.ws-indico-images.read: After a publish, `inspect` with kind `image` on a
    talk with a PDF attachment returns an image block. [evidence: executed_test]'
- id: req.ws-indico-images.off
  statement: 'With the option off (the default) the output is what it was: no
    `attachment_images` attr, the same change-probe configuration and the same content
    hash.


    Acceptance:

    - acc.ws-indico-images.off: A new test shows no attr, an unchanged hash with the
    image limit at 0, and a changed hash when images are found. [evidence:
    executed_test]'
tasks:
