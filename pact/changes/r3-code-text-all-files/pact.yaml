requirements:
- id: req.r3-code-text-all-files.all-text
  statement: 'The code-text source selects every tracked file (`include_globs: ["**/*"]`) except
    credential-named paths, the paths git-code skips and binary types (images, archives, compiled
    objects, office documents, fonts, PDFs). Every extension okg would route to a parser the pack''s
    extractors.yaml does not declare (Markdown, YAML, JSON, TOML, HTML, CSV, notebooks, LaTeX, mail)
    and the code extensions are routed to `text`; Python keeps okg''s PythonSymbolChunker; a file
    with no route is read as text when it reads as UTF-8 (`text_fallback: true`). `max_files` is
    25,000. The pack is
    version 0.2.0 and its description, prompt fragment and docs say what it now stores.


    Acceptance:

    - acc.r3-code-text-all-files.formats: every format a selected file can be routed to has a
    parser and a chunker in the pack''s extractors.yaml. [evidence: executed_test]

    - acc.r3-code-text-all-files.store: over a synthetic git repository, the shipped parameters
    store Markdown, a templated YAML file, JSON, a shell script, an extensionless script, a
    Makefile, a .cfg file and HTML as documents whose chunks hold each file''s text, store no
    document for a PNG or a JAR, and still cut Python per function. [evidence: executed_test]

    - acc.r3-code-text-all-files.install: against a fresh Postgres with okg''s extensions, the
    code-text pack alone (with git-code, which it requires) and the cern-team bundle with every
    optional pack each install with okg, ingest their fixture inputs and publish.
    [evidence: executed_test]'
- id: req.r3-code-text-all-files.secret-screen
  statement: 'The code-text registry entry names `archi.sources.code_text.SecretScreenedDocCorpusSource`,
    a DocCorpusSource subclass taking the same parameters. On every file listing it reads each
    selected file up to `max_bytes_per_file` and leaves out any file whose text holds a private key
    block (PGP blocks included), a vendor token (GitHub, GitLab, OpenAI-style, AWS key id, Slack,
    Google API key), a JWT, a non-hexadecimal base64 run of 80 or more characters that is not
    public material (SSH public key, package integrity hash, inline image, cluster CA), a URL with
    a password that is not a template (plain-word, URL-encoded and empty-user forms included), an
    Authorization or Bearer header or `curl -u` with a literal value, a key ending in a secret word
    (password, passwd, passphrase, pwd, pass, secret, token, credential(s), api/access/secret/
    private/auth key) assigned a literal value on the same line with `=`, `=>` or `:`, a bare
    `auth` key with a literal of 16 or more characters, a quoted multi-word passphrase, or a flag
    ending in a secret word (`--password`, `--client-secret`, `--access-token`), `mysql -p`, a
    .netrc `password` line or an XML secret element with a literal value. An identifier-shaped
    value with a digit is a literal (`archi_Xk9..._db`); one without is a variable name. Templates, environment lookups, YAML aliases, expressions, paths,
    prose and plain words are references and are kept; a URL to a documentation or placeholder
    host is not counted, and any other URL password that is not a template is, even `password`. Every pattern is bounded, so a 1 MB line
    screens in linear time. The verdict cache is keyed by the content''s SHA-256. A left-out file gets no document and no chunk; the
    source records the left-out paths (never values) in `screened_paths` and logs them.


    Acceptance:

    - acc.r3-code-text-all-files.rules: each literal-secret shape above is found and each reference
    shape is not, public base64 is not, and a 1 MB worst-case line screens in under 2 seconds.
    [evidence: executed_test]

    - acc.r3-code-text-all-files.leave-out: over a synthetic git repository, files holding a
    literal secret get no document and none of their secret text is stored, files that only
    reference a secret are kept, and okg''s own DocCorpusSource with the same parameters stores the
    secret files (control). A file that gains a secret in a later commit drops out of the next run
    of the same source object and comes back when the secret is removed, and a same-size rewrite
    with the old modification time is still left out. [evidence: executed_test]

    - acc.r3-code-text-all-files.planted: in the pack-isolation install (fresh Postgres, okg
    install, ingest, publish), git-code''s fixture repository holds a file with a planted, invented
    password; the published graph has a code-text document for the clean README and none for the
    planted file, and okg''s grep search for the password finds no record anywhere in the graph.
    [evidence: executed_test]

    - acc.r3-code-text-all-files.real-repos: run over the 18 repositories of the comp-ops instance
    with the shipped globs, the screen''s exclusions are reported (files selected, files left out,
    by class) and compared with the instance''s hand-made exclusion list and with the gold files
    of CompOps-42; no gold file is left out. [evidence: manual]'
