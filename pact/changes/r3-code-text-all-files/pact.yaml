pact_version: 5
id: r3-code-text-all-files
title: 'code-text stores every text file and leaves out files holding a literal secret'
tier: 2
why: 'On the comp-ops instance (CompOps-42, 2026-10-30) the agent with the graph''s MCP tools found
  0.259 of the gold evidence against 0.747 for an agent with bash over the raw files. The cause was
  the graph''s surface: git-code stores each repository file as a name with no text, and 44 of the
  66 gold records are git files, most of them YAML, shell scripts and Markdown. The code-text pack
  reads only code extensions and would have covered 19 of those 44. On
  that instance code-text was configured by hand to read every text file, with 303 files excluded
  after two secret scans; the graph agent then found 0.729 (bash 0.725) and scored 0.702 against
  0.571 with the LLM judge (evidence of r3-context-quality, compops42-agent-arms.md). Jason decided
  on 2026-10-31 (13:42Z, decision d716) that this becomes the default in 3.0: code-text reads all
  text files, with a secret screen. This change is that pack change. Turning code-text on in
  cms-comp-ops whenever git-code is selected needs a bundle-format rule (companion packs) and is a
  separate change, so this one leaves every bundle''s pack selection as it was.


  A hand-made exclusion list does not survive the next commit, so the screen is code that runs on
  every listing: archi''s SecretScreenedDocCorpusSource is okg''s DocCorpusSource with
  `_walk_files` overridden. okg''s change probe and its read both list files through that method,
  so they agree, and a file that gains a secret is not emitted by the next run (okg''s
  completed-scope deletion should then retract it; the tests prove the run, not the retraction). The rules are archi''s own regular expressions, not an
  import of okg''s private transcript-redaction module.


  Known lint finding. `okg lint deployments` reports DEPLOYMENT-001 ("a connector may not import
  okg.substrate") for `archi.sources.code_text`, which subclasses okg''s DocCorpusSource. It is the
  one recorded connector-side exception (docs/okg-alignment.md), accepted on 2026-10-31 because
  okg''s public SDK has no per-file content hook; runtime does not enforce the lint. Removal path:
  a public content-screen hook on DocCorpusSource in okg, requested through the coordinator.


  Known limits. okg''s `search(view="windows")` trusts stored character positions only from
  registry entries naming okg''s own DocCorpusSource, so a phrase, NEAR or regex window search
  inside code-text documents may answer `window_continuity_unknown`; plain search and text reads
  are unaffected (an okg-side hook would remove this). The screen is pattern matching: values
  under 8 characters and plain words are kept, and so are passwords under a key with no secret
  word (a Kubernetes `name:` / `value:` pair), values that start like a template (`$2b$` bcrypt
  hashes, `{...}`), keys over 64 characters and .netrc `default` lines; URLs to documentation
  hosts (loopback, `example.*`, `*.invalid`, `*.test`) and placeholder passwords (`pass`,
  `password`) are not counted. It covers code-text documents only: git-code''s
  history source stores per-file diffs, which okg redacts by its own patterns, so a secret removed
  from the current files can still be read in the diff that removed it. The file cap is okg''s
  default (25,000), since every text file now counts. The pack takes one repository per install; the
  comp-ops instance wires more by hand.'
