  requirement: req.r3-code-text-all-files.all-text
  verification: 'Widen the code-text source to every text file and route each text format to the
    text parser; test it on a synthetic repository.


    Proof: the changed pack tests pass; the full python/tests suite passes; the generated docs
    check passes; the pack-isolation install tests for code-text and cern-team publish against a
    fresh Postgres.


    Test plan:

    - python/tests/test_bundle_code_text.py [evidence: pytest]

    - python/tests/packs/test_pack_isolation.py [evidence: pytest]'
- id: task.r3-code-text-all-files.screen
  requirement: req.r3-code-text-all-files.secret-screen
  verification: 'Add SecretScreenedDocCorpusSource and its rules, point the pack at it, and test
    the rules and the end-to-end leave-out on synthetic repositories.


    Proof: the rule and leave-out tests pass; a measurement over the comp-ops repositories reports
    the screen''s exclusions against the hand-made list and loses no gold file.


    Test plan:

    - python/tests/sources/test_code_text_screen.py [evidence: pytest]

    - python/tests/test_bundle_code_text.py [evidence: pytest]

    - python/tests/packs/test_pack_isolation.py [evidence: pytest]'
