pact_version: 5
id: chunk-char-end
title: Chunks carry exact source positions so readers can cut the overlap
tier: 2
why: 'Found on real data by okg lane A (cms-kb dev graph kb76, okg dev f5f7c81ca3). A whole-page
  text read of twiki:CMS:EXO16010 returned 41,169 characters for a 39,173-character page:
  the 200-character overlap between neighbouring chunks came back twice. The stored chunk
  text is exact. The cause is here: _chunks (docs.py, and its copy in indico.py) strips each
  4,000-character window but reports the unstripped window offset as char_offset, and no emitter
  writes char_end. okg cuts a repeated overlap only when both neighbours are exact (char_end
  - char_offset equals the text length, offsets increasing and overlapping, and the previous
  text really ends with the cut characters), so it could never cut an archi overlap.


  DECISION (worker, 2026-09-29): _chunks returns the start of the stored text (window offset
  plus the leading whitespace strip removed); every emitter (twiki, docs, jira, hypernews,
  indico) writes char_end = char_offset + len(text) and keeps char_length. Chunk text, index,
  id and content_sha256 do not change. _pg_text only turns NUL into a space, which keeps the
  length, so the positions stay exact; no NUL reached chunked text in any real cache checked,
  so nothing more is done for it. Redaction (TWiki and JIRA email removal) runs before chunking,
  so the positions are in the redacted text the graph holds. char_end is already declared
  on DocumentChunk in okg''s extraction ontology, so no archi schema change is needed.'
