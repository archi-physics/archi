- pact/changes/chunk-char-end/probe_chunks.py
requirements:
- id: req.chunk-char-end.positions
  statement: 'Every document_chunk archi emits carries char_offset = the index where its stored
    text starts in the chunked text, and char_end = char_offset + len(text); chunk ids and
    content_sha256 are unchanged.


    Acceptance:

    - acc.chunk-char-end.unit: both _chunks copies return a start with text[start:start+len(chunk)]
    == chunk when windows start and end on whitespace; stitching the chunks by okg''s overlap
    rule gives text.strip(); index and chunk text equal the old chunker''s. [evidence: executed_test]

    - acc.chunk-char-end.emitters: the twiki, docs, jira, hypernews and indico readers emit
    char_end == char_offset + len(text) on a long record whose windows hit whitespace, and
    every neighbouring pair passes okg''s overlap rule; these tests fail on main. [evidence:
    executed_test]

    - acc.chunk-char-end.real: on real caches, rebuilding every record from its emitted chunks
    with okg dev''s order_segments + trim_overlap gives the chunked text for every multi-chunk
    TWiki page (the rest differ only by page-edge whitespace no chunk stores), EXO16010 comes
    back at 39,173 characters byte-identical, and chunk ids and hashes match main. [evidence:
    executed_test]'
tasks:
