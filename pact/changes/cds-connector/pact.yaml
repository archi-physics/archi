requirements:
- id: req.cds-connector.harvest
  statement: 'archi can harvest CMS records from CDS over OAI-PMH.


    A reader on the current SDK (preflight / run / ConnectorRun) walks one or more OAI sets,
    follows resumption tokens to completion, and emits one node per record with its title,
    abstract, authors, date, report numbers, record URL and OAI identifier. Sets are configuration,
    defaulting to cerncds:cms-pas and cerncds:cms-notes.


    Partial harvests must not claim complete scope: a resumption chain that breaks mid-walk
    reports the run incomplete rather than publishing a corpus missing its tail. That failure
    is invisible otherwise -- the records that did arrive look fine.


    Acceptance:

    - acc.cds-connector.harvest: Against recorded OAI fixtures, a multi-page harvest emits
    every record across the resumption chain; a broken chain yields completed_scope false.
    [evidence: executed_test]

    - acc.cds-connector.live: One live harvest of cerncds:cms-pas reaches completeListSize.
    [evidence: executed_test]'
- id: req.cds-connector.identifiers
  statement: 'The report number is parsed, not left in a blob.


    `CMS-PAS-HIG-19-001` is decomposed into its kind (PAS, NOTE, AN, PAPER), PAG code, year
    and number, and exposed as attributes. A consumer can then join a summary to the analysis
    note behind it without re-parsing strings, and cms-kb''s expansion does exactly that.


    Records with no report number, or with several, are handled explicitly: a record is not
    dropped for lacking one, and multiple identifiers do not silently pick the first.


    Acceptance:

    - acc.cds-connector.identifiers: Parsing covers PAS, NOTE and AN forms plus the no-identifier
    and multiple-identifier cases, each asserted against a real harvested record. [evidence:
    executed_test]'
- id: req.cds-connector.bundle
  statement: 'The connector is installable, and does not perturb anyone who does not install
    it.


    A schema slice declares whatever subtype the records land as, with the archetype annotation
    that registers it (the composition-root work lost a day to narrowings referencing a class
    that carried none). A `cds.yaml.example` ships in the cern-team bundle, off by default
    like every other optional source there. archi''s existing suite stays green.


    Acceptance:

    - acc.cds-connector.bundle: python/tests passes with the new source present and no existing
    test changed to accommodate it. [evidence: executed_test]'
tasks:
- id: task.cds-connector.reader
  requirement: req.cds-connector.harvest
