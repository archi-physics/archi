pact_version: 5
id: cds-connector
title: 'A CDS connector: CMS Physics Analysis Summaries and Notes'
tier: 2
why: 'CDS is the CERN Document Server: it holds the published and semi-published record of
  CMS physics -- Physics Analysis Summaries, CMS Notes, papers. It is the one source in the
  physics expansion with no connector anywhere, in archi or in mitdbg/okg-deployments/cms,
  so it has to be written rather than enabled. It belongs here rather than in cms-kb because
  a CERN document server is not CMS-physics-specific: any HEP deployment on this distribution
  wants it.


  MEASURED BEFORE DESIGNING, 2026-09-25, because it determines the whole shape:


  - The CDS search and REST APIs are behind an anti-bot interstitial. `GET /api/records/?q=CMS`
  returns 200 with an HTML page titled ''Making sure you''re not a bot!'', not JSON. A connector
  built on them would appear to work and harvest nothing.

  - The OAI-PMH endpoint `/oai2d` answers properly, unauthenticated. `verb=ListSets` advertises
  `cerncds:cms-pas` and `cerncds:cms-notes`. `verb=ListRecords&metadataPrefix=oai_dc&set=cerncds:cms-pas`
  returns 495 records per page with a resumption token and `completeListSize=2081`.

  - Records carry the report number as a `dc:identifier` (`CMS-PAS-SUS-08-005`) alongside
  the record URL and the OAI id.


  So: OAI-PMH harvest, not the search API. That is the design decision this measurement forces,
  and it is recorded here so nobody re-derives it by building the wrong thing first.


  THE REPORT NUMBER IS THE POINT. `CMS-PAS-HIG-19-001` shares its PAG-YY-NNN code with analysis
  note `HIG-19-001`. A deployment carrying both can answer ''what was published from this
  note'' and ''which note backs this summary''. A CDS connector that harvests titles and abstracts
  but does not expose that key is worth much less, so the identifier parsing is a requirement
  here rather than a nicety left to consumers.'
