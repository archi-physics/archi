version: 1
intents:
  sealed_benchmark:
    skill: sealed_benchmark
    description: Answer benchmark questions from sanitized question text only.
    subtypes: ["*"]
  cms_agentic_benchmark:
    skill: agentic_benchmark
    description: Run a real CLI agent against CMS OKG MCP with canonical evidence IDs.
    subtypes: ["*"]
  cms_operator_knowledge:
    skill: operator_knowledge
    description: Classify operator question types and assemble typed evidence before answer synthesis.
    subtypes:
      - documentation_page
      - document_chunk
      - jira_issue
      - site
      - storage_endpoint
      - dataset
      - workflow
      - monitoring_snapshot
  cms_evidence_retrieval:
    skill: evidence_retrieval
    description: Search, inspect canonical parents, and cite OKG evidence IDs.
    subtypes:
      - document_chunk
      - documentation_page
      - jira_issue
      - site
      - storage_endpoint
      - dataset
      - workflow
      - monitoring_snapshot
  cms_source_document_exploration:
    skill: source_document_exploration
    description: Expand good chunks into parent/ordered document context and inspect source metadata with bounded OKG SQL.
    subtypes:
      - documentation_page
      - document
      - document_chunk
      - jira_issue
  cms_migration_summary:
    skill: migration_summary
    description: Expand migration questions through related tickets, endpoints, and cleanup evidence.
    subtypes:
      - jira_issue
      - documentation_page
      - document_chunk
      - storage_endpoint
      - site
  cms_date_lookup:
    skill: date_lookup
    description: Find operational dates using aliases, historical endpoint names, and ticket families.
    subtypes:
      - jira_issue
      - documentation_page
      - document_chunk
      - site
      - storage_endpoint
  rucio_command:
    skill: rucio_command
    description: Return canonical Rucio CLI syntax before CMS-specific examples.
    subtypes:
      - dataset
      - storage_endpoint
      - documentation_page
      - document_chunk
      - jira_issue
  cms_procedure_extraction:
    skill: procedure_extraction
    description: Extract canonical procedures, commands, placeholders, and policy-dependent flags.
    subtypes:
      - documentation_page
      - document_chunk
      - jira_issue
  rucio_dataset_hosting:
    skill: rucio_dataset_hosting
    description: Traverse RSE, storage endpoint, dataset hosting, replica, and impact evidence.
    subtypes:
      - storage_endpoint
      - dataset
      - site
      - monitoring_snapshot
      - jira_issue
  cms_condor_monitoring_snapshot:
    skill: monitoring_condor_snapshot
    description: Answer job, workflow, site, and Condor monitoring questions from generation-pinned snapshots.
    subtypes:
      - monitoring_snapshot
      - workflow
      - site
      - jira_issue
  cms_policy_exception_arbitration:
    skill: policy_exception_arbitration
    description: Separate general policy, exception tickets, and graph state when sources disagree.
    subtypes:
      - documentation_page
      - jira_issue
      - dataset
      - storage_endpoint
  cms_incident_root_cause:
    skill: incident_root_cause
    description: Cluster incident evidence and distinguish confirmed cause, suspected cause, symptom, and mitigation.
    subtypes:
      - jira_issue
      - monitoring_snapshot
      - site
      - workflow
      - dataset
  cms_site_profile:
    skill: site_profile
    description: Separate and arbitrate site, RSE, monitoring, ticket, and documentation facts.
    subtypes:
      - site
      - storage_endpoint
      - monitoring_snapshot
      - jira_issue
      - documentation_page
