# CMSSW release catalog connector, releases.map fetch mode (network, no
# auth). The connector fetches the public cms-bot releases.map into
# ${archi_data_root}/cmssw-releases/ and builds the record set from it:
# release and family nodes and deterministic supersedes edges.
#
# To pin the catalog to bytes you have reviewed instead of fetching it,
# replace this entry after install with frozen/cmssw_releases.yaml (see
# docs/frozen-cmssw-input.md).
cmssw_releases:
  module: archi.sources.cmssw
  class: CMSSWReleaseAdapter
  ownership_id: ${deployment_name}.cmssw-releases
  admission_policy:
    producer_id: ${deployment_name}.cmssw-releases
    producer_kind: source
    trust_label: implicit_legacy_trusted
    admission_mode: fast_track
    authority_scope:
      source_family: cmssw-releases
      source_name: cmssw_releases
    output_signature:
      nodes:
        - {subtype: cmssw_release}
      edges:
        - {src_subtype: cmssw_release, edge_type: supersedes, dst_subtype: cmssw_release}
    output_scope_summary:
      summary: CMSSW releases, release families, and supersedes chains
      nodes: [cmssw_release]
      edges:
        - cmssw_release supersedes cmssw_release
  source_class: reference_catalog
  # NOTE: the substrate's reference_catalog profile only admits
  # `domain_key` (deployment lint blocker
  # deployment.source_registry.profile_invalid otherwise); the
  # cmssw.py docstring template and the w1-scratch proven registry
  # both use it.
  record_identity_kind: domain_key
  record_identity_fields: [release]
  source_revision_kind: content_hash
  deletion_semantics: missing_from_completed_scope
  publication_mode: published_generation
  required_for_baseline: true
  params:
    map_cache_path: ${archi_data_root}/cmssw-releases/releases.map
    releases_map_url: '${releases_map_url}'
    fetch: true
    # No `limit` here on purpose: the real releases.map has far more
    # than any reasonable cap, and a cap that actually truncates makes
    # every run forfeit its completed-scope claim (circleback-fixes
    # finding 7) — completed_scope stays False forever, so
    # missing_from_completed_scope deletion semantics never fire. The
    # live demo ingested the full map fine; only set `limit` for
    # debugging, accepting that retraction is disabled while it is set.
  sync:
    triggers: [manual, reconcile]
    default_event_mode: scope_complete
    reconcile_mode: scope_complete
