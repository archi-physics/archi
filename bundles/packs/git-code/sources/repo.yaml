# Code repository connector: the tracked files of one Git repository, via
# okg's own git_graph adapter. Any Git URL works (GitHub, GitLab, a local
# path); the URL comes from the `--git-code-repo-url` install answer.
#
# THE CONNECTOR CLONES ITSELF. `manage_checkout: true` with a `url` makes
# this source own `repo_root`: the runner clones it if missing and
# fast-forwards it if present before the change probe reads HEAD, so an
# operator declares a URL and never runs `git clone`. A private repository
# uses the operator's own git credentials; no token reaches the instance.
#
# repo_root is anchored under ${archi_data_root} rather than left relative:
# GitFilesSource resolves a relative repo_root against the PROCESS working
# directory, and a repo source that finds no repo blocks the whole publish.
#
# Why not archi/sources/github_repos.py: that connector records that a
# repository exists; it does not read it. This one stores the files.
repo:
  module: okg.substrate.library.sources.git_graph_files
  class: GitFilesSource
  ownership_id: ${deployment_name}.git-repo
  admission_policy:
    producer_id: ${deployment_name}.git-repo
    producer_kind: source
    trust_label: implicit_legacy_trusted
    admission_mode: fast_track
    authority_scope:
      source_family: git-code
      source_name: repo
    output_signature:
      nodes:
        - {subtype: source_file}
        - {subtype: git_branch}
      edges:
        - {src_subtype: source_file, edge_type: member_of, dst_subtype: git_branch}
    output_scope_summary:
      summary: tracked files of the configured repository and the branch they belong to
      nodes: [source_file, git_branch]
      edges:
        - source_file member_of git_branch
  source_class: discovery_crawl
  record_identity_kind: scoped_locator
  record_identity_fields: [repo, path]
  source_revision_kind: content_hash
  deletion_semantics: missing_from_completed_scope
  publication_mode: published_generation
  required_for_baseline: false
  params:
    repo: '${repo_name}'
    url: '${repo_url}'
    manage_checkout: true
    # SINGLE-quoted. Answers are substituted as text and the result is then
    # parsed as YAML: unquoted, a path containing `#` would be truncated as a
    # comment; double-quoted, a backslash in a Windows path would be read as
    # an escape and silently corrupt the value. Single quotes take both
    # literally. An apostrophe in an answer breaks the parse loudly.
    repo_root: '${archi_data_root}/repos/${repo_name}'
    include_untracked: false
    exclude_globs:
      - "**/__pycache__/**"
      - "**/.venv/**"
      - "**/node_modules/**"
      - "**/.git/**"
      - "**/*.pyc"
  sync:
    triggers: [manual, reconcile]
    default_event_mode: scope_complete
    reconcile_mode: scope_complete
