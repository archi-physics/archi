# Coverage for the subtypes this pack emits. It leaves with the pack.
invariants:
  - name: tickets_coverage
    severity: error
    scope: cross
    timeout_ms: 5000
    description: >-
      The tickets source must have live tickets. Required live subtypes: tracker_ticket. A missing one means the input
      was empty or the connector regressed.
    sql: |
      WITH required(subtype) AS (
        VALUES ('tracker_ticket')
      ),
      counts AS (
        SELECT subtype, count(*) AS n
          FROM okg.v_nodes
         GROUP BY subtype
      )
      SELECT r.subtype, coalesce(c.n, 0) AS live_count
        FROM required r
        LEFT JOIN counts c USING (subtype)
       WHERE coalesce(c.n, 0) = 0
