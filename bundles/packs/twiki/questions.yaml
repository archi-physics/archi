init_questions:
  - id: eos_root
    prompt: directory holding your TWiki EOS dump (absolute path)
    type: string
    required: true
    description: |
      A directory of raw TWiki markup: one `<Topic>.txt` per topic, each
      including its `%META:` lines. Subdirectories are subwebs. Topics of
      the web named by `web_root` (CMS in the shipped template) sit directly
      in this directory; do not nest them under an extra `CMS/` folder or
      every page id is double-prefixed.

      Give an absolute path. A relative one is read from the directory okg
      runs from, not from the deployment directory, and does not follow
      `archi_data_root`.

      A missing or empty dump blocks the publish rather than shrinking the
      graph quietly. To scope the read, edit the installed registry entry:
      `seed_topics` and `max_depth` for a subtree, `physics_filter` for
      physics topics only, `page_index_path` to write the kept page ids.

  - id: physics_filter
    prompt: keep only physics topics (true or false)
    type: string
    required: false
    default: 'false'
    description: |
      `true` narrows a CMS snapshot to physics topics (PAG, POG and workbook
      roots, their parent topics, and documentation page types) and drops the
      computing-operations roots. Use it for a physics instance; leave the
      default for an operations one. Give exactly `true` or `false`; anything
      else (a typo such as `ture`) is refused when the source starts.
