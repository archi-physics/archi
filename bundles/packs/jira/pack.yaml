name: jira
kind: context
version: 0.1.0
description: JIRA issues and their participants, read from the cache the JIRA downloader writes.
requires:
  modules: [document_starter, person, extraction]
schemas: schemas/
sources: sources/
invariants: invariants.yaml
# Tickets are what operators triage today; the downloader cache may be a day
# old and no more.
freshness:
  jira.jira: {max_staleness: 24h}
# Link-coverage targets (ADR 0002 section 6.1): each becomes the warn-level
# invariant jira_link_<name>.
link_coverage:
  # Every JIRA issue has a reporter.
  - {name: issue_reporter, from: jira_issue, edge: reported_by, to: person, direction: out, min_fraction: 0.9}
search_subtypes: [jira_issue, document_chunk]
prompt_fragment: prompt.md
credentials: [CERN_JIRA_TOKEN]
# The downloader runs anonymously for public projects; the token only
# widens what it can read.
needs_credentials: false
