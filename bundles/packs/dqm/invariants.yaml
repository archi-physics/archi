# Coverage for the subtypes this pack emits. It leaves with the pack.
invariants:
  - name: dqm_coverage
    severity: error
    scope: cross
    timeout_ms: 5000
    description: >-
      The DQM source must have live certifications and runs. Required
      live subtypes: data_certification, run. A missing one means the
      input was empty or the connector regressed.
    sql: |
      WITH required(subtype) AS (
        VALUES ('data_certification'), ('run')
      ),
      counts AS (
        SELECT subtype, count(*) AS n
          FROM okg.v_nodes
         GROUP BY subtype
      )
      SELECT r.subtype, coalesce(c.n, 0) AS live_count
        FROM required r
        LEFT JOIN counts c USING (subtype)
       WHERE coalesce(c.n, 0) = 0
