# MONIT (monit_rucio_transfer): a daily monitoring snapshot from CERN MONIT (Grafana /
# OpenSearch). With a cache at the records_path below the source reads it;
# without one it queries MONIT live with the token in MONIT_GRAFANA_TOKEN
# (read by environment-variable reference only). Its edges start at the
# site and storage_endpoint nodes of the cms-catalogs pack, which this pack
# requires.
monit_rucio_transfer:
  module: archi.sources.monit
  class: MONITRucioTransferAdapter
  ownership_id: ${deployment_name}.monit-rucio-transfer
  admission_policy:
    producer_id: ${deployment_name}.monit-rucio-transfer
    producer_kind: source
    trust_label: implicit_legacy_trusted
    admission_mode: fast_track
    authority_scope:
      source_family: monit-live
      source_name: monit_rucio_transfer
    output_signature:
      nodes:
        - {subtype: transfer_job}
      edges:
        - {src_subtype: site, edge_type: hosts, dst_subtype: transfer_job}
        - {src_subtype: site, edge_type: transfers_to, dst_subtype: site}
    output_scope_summary:
      summary: per-site-pair Rucio transfer aggregates from MONIT enriched events
      nodes: [transfer_job]
      edges:
        - site hosts transfer_job
        - site transfers_to site
  source_class: mutable_api
  record_identity_kind: remote_id
  record_identity_fields: [transfer_id]
  source_revision_kind: updated_at
  deletion_semantics: missing_from_completed_scope
  publication_mode: published_generation
  credential_refs: [MONIT_GRAFANA_TOKEN]
  required_for_baseline: false
  params:
    records_path: ${archi_data_root}/monit-rucio-transfer/records.json
    token_env: MONIT_GRAFANA_TOKEN
    from_time: now-7d
    to_time: now
    max_src_sites: 500
    max_dst_sites: 500
    # CMS defaults, shown for overriding on another instance:
    # grafana_base_url: https://monit-grafana.cern.ch
    # datasource_id: 9732
    # index: monit_prod_cms_rucio_enr_events-*
  sync:
    triggers: [manual, reconcile]
    default_event_mode: scope_complete
    reconcile_mode: scope_complete
