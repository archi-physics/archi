# Edge narrowings for the slurm pack's source emissions.
#
# The composer honours narrowings only under schemas/bridges/. A narrowing
# anywhere else is silently ignored and fails at ingest with
# ProducerPolicyViolation. Person is okg's (person module); the other classes
# are in ../slurm.yaml.
id: https://archi-physics.org/okg/archi/bridges/slurm
name: archi_slurm_narrowings
title: Archi slurm bridge narrowings
description: Narrowings for archi.sources.slurm emissions.

prefixes:
  linkml: https://w3id.org/linkml/
  archi: https://archi-physics.org/okg/archi/

default_range: string

imports:
  - linkml:types

classes:
  EdgeNarrowings:
    description: Narrowings for archi.sources.slurm emissions.
    annotations:
      okg_edge_narrowings: 'true'
    attributes:
      slurm_partition_contains_node:
        annotations:
          edge_archetype: contains
          src_subtypes: SlurmPartition
          dst_subtypes: SlurmNode
      slurm_node_executes_job:
        annotations:
          edge_archetype: executes
          src_subtypes: SlurmNode
          dst_subtypes: SlurmJob
      slurm_job_member_of_partition:
        annotations:
          edge_archetype: member_of
          src_subtypes: SlurmJob
          dst_subtypes: SlurmPartition
      slurm_reservation_references_node:
        annotations:
          edge_archetype: references
          src_subtypes: SlurmReservation
          dst_subtypes: SlurmNode
