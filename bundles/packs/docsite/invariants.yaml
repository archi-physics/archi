# Coverage for the subtypes this pack emits. It leaves with the pack.
invariants:
  - name: docsite_coverage
    severity: error
    scope: cross
    timeout_ms: 5000
    description: >-
      The docsite source must have live documentation pages. Required
      live subtypes: documentation_page. A missing one means the input
      was empty or the connector regressed.
    sql: |
      WITH required(subtype) AS (
        VALUES ('documentation_page')
      ),
      counts AS (
        SELECT subtype, count(*) AS n
          FROM okg.v_nodes
         GROUP BY subtype
      )
      SELECT r.subtype, coalesce(c.n, 0) AS live_count
        FROM required r
        LEFT JOIN counts c USING (subtype)
       WHERE coalesce(c.n, 0) = 0
