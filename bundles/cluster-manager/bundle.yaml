name: cluster-manager
version: 0.1.0
description: A cluster manager's knowledge instance - documentation, tickets, operational memory and, optionally, ServiceNow, Slurm, HTCondor, node health and code.
# ADR 0002 section 5. No pack that belongs to a lab's own bundles, in the defaults or among the
# options: it has to work for any cluster operator. docsite, tickets (Redmine) and ops-record
# need no credential.
# ServiceNow needs its own account; Slurm and HTCondor read an exported snapshot and ship
# live tools that run only on an instance that wires them (every action needs an approved
# L2 escalation). ticket-triage, the automation pack (PACT r3-auto-ticket-triage), triages
# the tickets pack's Redmine and JIRA tickets and, when selected, the ServiceNow ones; it
# starts in shadow at L1.
packs:
  default: [docsite, tickets, ops-record]
  optional: [servicenow, slurm, htcondor, git-code, node-health, ticket-triage]
# docsite caches two data-management documentation sites by default; a cluster manager
# starts from the schedulers' own documentation instead.
answers:
  docsite_urls: "https://slurm.schedmd.com/documentation.html,https://htcondor.readthedocs.io/en/latest/"
chat:
  site_name: Cluster operations chat
  default_model: llama3.1:8b
  description: >-
    Answers from this instance's knowledge graph (documentation, tickets, past
    incidents and whatever else the instance indexes) with the sources it used.
  suggestions:
    - How do I drain a node in Slurm, and what does the documentation say about it?
    - Which tickets mention a node that is currently down?
    - Have we seen this error before, and what fixed it?
okg: ">=0.2.0,<0.3"
