# Invariants for the cern-team bundle.
#
# The floor may only name subtypes a bare install actually produces. Three
# sources install by default: cmssw_releases (always emits), and github_repo /
# gitlab_repo, which emit nothing until the operator supplies a repository URL
# (both default to blank). Every source that emits documentation_page or
# jira_issue -- docsite, twiki_crawl, twiki_eos, jira, indico -- ships as
# `.yaml.example` and is off until an operator renames it.
#
# So the old floor required rows from sources that were not installed, and a
# bare instance could never reach a green publish. cmssw_release is the only
# subtype a bare install is guaranteed to have. Coverage for an optional source
# belongs to an invariant installed alongside it.
#
# Cold-start note unchanged: this fires until the first ingest has published;
# run the ingest before the first publish, as the install runbook does.

invariants:
  - name: cern_team_core_pages_floor
    severity: error
    scope: cross
    timeout_ms: 5000
    description: >-
      The default CMSSW release source must have at least one live row. A
      missing entry signals a connector-coverage regression. Optional source
      coverage belongs to invariants installed with those sources.
    sql: |
      WITH required(subtype) AS (
        VALUES ('cmssw_release')
      ),
      counts AS (
        SELECT subtype, count(*) AS n
          FROM okg.v_nodes
         GROUP BY subtype
      )
      SELECT r.subtype, coalesce(c.n, 0) AS live_count
        FROM required r
        LEFT JOIN counts c USING (subtype)
       WHERE coalesce(c.n, 0) = 0
