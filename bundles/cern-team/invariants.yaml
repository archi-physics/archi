# Invariants for the cern-team bundle.
#
# The floor may only name subtypes a bare install actually produces. One
# source installs by default -- cmssw_releases, which always emits. Every
# other source, github_repo and gitlab_repo included, ships as
# `.yaml.example` and is off until an operator renames it. There is no
# installed-but-inactive source: one that cannot read its input fails
# admission and blocks the publish for every other source too.
#
# An earlier floor required rows from sources that were not installed, so a
# bare instance could never reach a green publish. cmssw_release is the only
# subtype a bare install is guaranteed to have. Coverage for an optional source
# belongs to an invariant installed alongside it.
#
# An instance that DROPS cmssw_releases -- a documentation-only or TWiki-only
# install -- must remove or replace this invariant, or it carries a permanent
# error-severity failure for a source it does not have.
#
# Cold-start note unchanged: this fires until the first ingest has published;
# run the ingest before the first publish, as the install runbook does.

invariants:
  - name: cern_team_core_pages_floor
    severity: error
    scope: cross
    timeout_ms: 5000
    description: >-
      The default CMSSW release source must have at least one live row. A
      missing entry signals a connector-coverage regression. Optional source
      coverage belongs to invariants installed with those sources.
    sql: |
      WITH required(subtype) AS (
        VALUES ('cmssw_release')
      ),
      counts AS (
        SELECT subtype, count(*) AS n
          FROM okg.v_nodes
         GROUP BY subtype
      )
      SELECT r.subtype, coalesce(c.n, 0) AS live_count
        FROM required r
        LEFT JOIN counts c USING (subtype)
       WHERE coalesce(c.n, 0) = 0
