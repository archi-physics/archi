name: fixture-ops-watch
kind: automation
version: 0.1.0
description: Third-party test automation that uses a live tool of the shipped monit-live pack.
requires:
  packs: [monit-live]
playbooks: playbooks/
action_classes: action_classes.yaml
needs_credentials: false
automation:
  trigger: {type: schedule, cron: "*/30 * * * *"}
  context_gate:
    sources: [monit-live.monit_sam]
    max_staleness: 36h
  playbook: watch.md
  action_classes: [look_up_condor]
  proposal_schema:
    type: object
    required: [summary, evidence_ids, action_class, payload, confidence, rollback]
    additionalProperties: false
    properties:
      summary: {type: string}
      evidence_ids: {type: array, minItems: 1, items: {type: string}}
      action_class: {type: string}
      payload: {type: object}
      confidence: {type: number, minimum: 0, maximum: 1}
      rollback: {type: string}
  budget: {cost_per_run: 0.25, cost_per_day: 5, runs_per_hour: 4}
  default_level: L0
  max_level: L2
