# Archi W2 — bridge narrowings for the catalog/feed sources
# (req.w2.sources-catalogs).
#
# Copied wholesale from the proven cms deployment bridge
# okg-deployments cms/schemas/bridges/cms_narrowings.yaml at
# main@f33a9c4, adapting only the id/name headers to archi naming
# (attribute content verbatim). Thirteen narrowings the cms file also
# carried are NOT here because they already ship (same or equivalent
# name) in archi/schemas/bridges/sources.yaml — keep ONE definition
# each, in sources.yaml:
#   jira_issue_assigned_to_person, jira_issue_reported_by_person,
#   jira_issue_contains_chunk, chunk_references_jira_issue,
#   documentation_page_contains_chunk,
#   documentation_page_references_documentation_page,
#   chunk_references_release (as chunk_references_cmssw_release),
#   repository_contains_documentation_page
#     (as repo_contains_documentation_page),
#   and — landed with the MONIT port — site_hosts_monitoring_snapshot,
#   site_hosts_transfer_job, transfer_site_to_site, site_hosts_dataset,
#   storage_endpoint_hosts_dataset (declared there with
#   optional_when_subtypes_missing so the sources slice composes green
#   without this file).
# Copy this file into the deployment as
# <deployment>/schemas/bridges/operations.yaml alongside
# archi/schemas/operations.yaml -> <deployment>/schemas/operations.yaml
# (the catalog composer only honors narrowings under schemas/bridges/).

id: https://archi-physics.org/okg/archi/bridges/operations
name: archi_operations_narrowings
title: Archi W2 — operations bridge narrowings
description: Narrowings needed by the ported catalog/feed source adapters.

prefixes:
  linkml: https://w3id.org/linkml/
  archi: https://archi-physics.org/okg/archi/

default_range: string

imports:
  - linkml:types

classes:
