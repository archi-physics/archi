          src_subtypes: DocumentChunk
          dst_subtypes: Run

      # A git commit whose message names a Jira key (CMSTRANSF-974) links
      # to that ticket: the cms_jira_key extractor route for git_commit in
      # enrichment/defaults/linker_config.yaml. The target is matched
      # exactly (ProjectionAliasBackend); a key with no ticket in the graph
      # makes no edge and stays an unresolved link_retry row.
      # Optional so a deployment without the git_graph module composes.
      git_commit_references_jira_issue:
        annotations:
          edge_archetype: references
          src_subtypes: GitCommit
          dst_subtypes: JiraIssue
          optional_when_subtypes_missing: 'true'
