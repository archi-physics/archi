verbosity: {{ verbosity }}
# CPU threads torch uses in the data-manager and chatbot (OMP_NUM_THREADS and
# MKL_NUM_THREADS). null sets neither; Jinja would write None, a string Helm treats as set.
torch_threads: {{ torch_threads if torch_threads else 'null' }}
archi:
  name: {{ archi_name }}

service_type: ClusterIP
hostMode: {{ 'true' if host_mode else 'false' }}

gpu:
  enabled: {{ 'true' if gpu_enabled else 'false' }}
  devices: {{ gpu_devices | default("", true) | tojson }}
  count: {{ gpu_count if gpu_count else 'null' }}

postgres:
  image: a2rchi/archi-postgres:latest
  port: {{ postgres_port }}
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  pvc:
    resources:
      requests:
        storage: "500Mi"
      limits:
        storage: "5Gi"

chat:
  image: a2rchi/archi-chat:latest
  port: {{ chatbot_port_host }}
  externalPort: {{ chatbot_port_container }}
  resources:
    requests:
      cpu: "500m"
      memory: "500Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
      {% if gpu_count %}
      nvidia.com/gpu: {{ gpu_count }}
      {% endif %}
  pvc:
    resources:
      requests:
        storage: "100Mi"
      limits:
        storage: "250Mi"
  modelsPvc:
    resources:
      requests:
        storage: "20Gi"
      limits:
        storage: "50Gi"


data_manager:
  image: a2rchi/archi-data-manager:latest
  port: {{ data_manager_port_host }}
  externalPort: {{ data_manager_port_container }}
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  pvc:
    resources:
      requests:
        storage: "100Mi"
      limits:
        storage: "250Mi"

{% if grafana.enabled %}
grafana:
  port: {{ grafana.port_host }}
  externalPort: {{ grafana.port_container }}
{% endif %}

{% if grader.enabled %}
grader:
  port: {{ grader.port_host }}
  externalPort: {{ grader.port_container }}
{% endif %}