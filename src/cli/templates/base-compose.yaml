services:
  {% if data_manager_enabled -%}
  data-manager:
    image: {{ data_manager_image }}:{{ data_manager_tag }}
    build:
      context: .
      dockerfile: archi_code/cli/templates/dockerfiles/Dockerfile-data-manager
      args:
        APP_VERSION: {{ app_version }}
    container_name: {{ data_manager_container_name }}
    {% if postgres_enabled -%}
    depends_on:
      postgres:
        condition: service_healthy
      config-seed:
        condition: service_completed_successfully
    {% endif -%}
    environment:
      PGHOST: {{ 'localhost' if host_mode else 'postgres' }}
      PGPORT: {{ postgres_port }}
      PGDATABASE: archi-db
      PGUSER: archi
      PG_PASSWORD: ${PG_PASSWORD}
      VERBOSITY: {{ verbosity }}
      {% for secret in required_secrets | default([]) -%}
      {{ secret.upper() }}_FILE: /run/secrets/{{ secret.lower() }}
      {% endfor %}
    env_file:
      - .env
    secrets:
      {% for secret in required_secrets | default([]) -%}
      - {{ secret.lower() }}
      {% endfor %}
    volumes:
      - {{ data_manager_volume_name }}:/root/data/
      - ./configs:/root/archi/configs
      - ./weblists:/root/archi/weblists
      {%- for srv_name, srv_cfg in (mcp_servers | default({})).items() %}
      {%- if srv_cfg.shared_volume %}
      - {{ srv_cfg.shared_volume }}-{{ name }}:/shared/{{ srv_cfg.shared_volume }}:ro
      {%- endif %}
      {%- endfor %}
    logging:
      options:
        max-size: 10m
    ports:
      - {{ data_manager_port_host }}:{{ data_manager_port_container }}
    restart: always
    {% if host_mode -%}
    network_mode: host
    {% endif %}
  {%- endif %}

  {% if postgres_enabled -%}
  postgres:
    build:
      context: .
      dockerfile: archi_code/cli/templates/dockerfiles/Dockerfile-postgres
    container_name: {{ postgres_container_name }}
    command: ["postgres", "-p", "{{ postgres_port }}"]
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_USER: archi
      POSTGRES_DB: archi-db
      PGPORT: {{ postgres_port }}
      VERBOSITY: {{ verbosity }}
    env_file:
      - .env
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - {{ postgres_volume_name }}:/var/lib/postgresql/data
    logging:
      options:
        max-size: 10m
    restart: always
    {% if host_mode -%}
    network_mode: host
    {% endif %}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archi -d archi-db -p {{ postgres_port }}"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 1gb
  
  config-seed:
    image: {{ chatbot_image | default(benchmarking_image) }}:{{ chatbot_tag | default(benchmarking_tag) }}
    build:
      context: .
      dockerfile: archi_code/cli/templates/dockerfiles/Dockerfile-chat
      args:
        APP_VERSION: {{ app_version }}
    container_name: {{ name }}-config-seed
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: {{ 'localhost' if host_mode else 'postgres' }}
      PGPORT: {{ postgres_port }}
      PGDATABASE: archi-db
      PGUSER: archi
      PG_PASSWORD: ${PG_PASSWORD}
      VERBOSITY: {{ verbosity }}
      CONFIG_PATH: /rendered-config/config.yaml
    env_file:
      - .env
    volumes:
      - ./configs:/rendered-config:ro
    command: ["bash", "-lc", "python -m src.cli.tools.config_seed"]
    restart: "no"
    {%- if host_mode %}
    network_mode: host
    {%- endif %}
  {%- endif %}

  # Application services (conditional)
  {% if chatbot_enabled -%}
  chatbot:
    image: {{ chatbot_image }}:{{ chatbot_tag }}
    build:
      context: .
      dockerfile: archi_code/cli/templates/dockerfiles/Dockerfile-chat{{ '-gpu' if gpu_ids else '' }}
      args:
        APP_VERSION: {{ app_version }}
    container_name: {{ chatbot_container_name }}
    {% if postgres_enabled -%}
    depends_on:
      postgres:
        condition: service_healthy
      config-seed:
        condition: service_completed_successfully
    {% endif -%}
    environment:
      PGHOST: {{ 'localhost' if host_mode else 'postgres' }}
      PGPORT: {{ postgres_port }}
      PGDATABASE: archi-db
      PGUSER: archi
      PG_PASSWORD: ${PG_PASSWORD}
      VERBOSITY: {{ verbosity }}
      # Allow overriding Ollama host via env so containers can reach host daemon
      OLLAMA_HOST: ${OLLAMA_HOST:-}
      {% for secret in required_secrets | default([]) -%}
      {{ secret.upper() }}_FILE: /run/secrets/{{ secret.lower() }}
      {% endfor %}
      {% if gpu_ids -%}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
      {% endif %}
    env_file:
      - .env
    {% if gpu_ids and not use_podman -%}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    {% endif %}
    secrets:
      {% for secret in required_secrets | default([]) -%}
      - {{ secret.lower() }}
      {% endfor %}
    volumes:
      - {{ data_manager_volume_name }}:/root/data/
      - ./configs:/root/archi/configs
      - ./data/prompts:/root/archi/data/prompts:ro
      - ./data/agents:/root/archi/agents
      - ./data/ab_agents:/root/archi/ab_agents
      - ./data/skills:/root/archi/skills:ro
      - ./data/evaluations:/root/archi/evaluations
      {% for prompt_file in prompt_files | default([]) -%}
      - ./{{ prompt_file }}:/root/archi/{{ prompt_file }}
      {% endfor %}
      {% if gpu_ids -%}
      - archi-models:/root/models/
      {%- endif %}
      {%- for srv_name, srv_cfg in (mcp_servers | default({})).items() %}
      {%- if srv_cfg.transport == 'stdio' and srv_cfg.path is defined %}
      - {{ srv_cfg.path }}:/root/mcp-packages/{{ srv_name }}:ro
      {%- endif %}
      {%- for host_mount in (srv_cfg.host_file_mounts | default([])) %}
      {%- if host_mount is string %}
      - {{ host_mount }}:{{ host_mount }}:ro
      {%- else %}
      - {{ host_mount.src }}:{{ host_mount.dest }}{{ ':ro' if host_mount.read_only | default(true) else '' }}
      {%- endif %}
      {%- endfor %}
      {%- endfor %}
    {#- Build the MCP auto-install command for stdio packages with a path #}
    {%- set mcp_installs = [] %}
    {%- for srv_name, srv_cfg in (mcp_servers | default({})).items() %}
    {%- if srv_cfg.transport == 'stdio' and srv_cfg.path is defined %}
    {%- set _ = mcp_installs.append(srv_name) %}
    {%- endif %}
    {%- endfor %}
    {%- if mcp_installs %}
    command:
      - bash
      - -lc
      - >-
        {%- for srv_name in mcp_installs %}
        cp -r "/root/mcp-packages/{{ srv_name }}" "/tmp/mcp-build-{{ srv_name }}" &&
        python -m pip install "/tmp/mcp-build-{{ srv_name }}" &&
        rm -rf "/tmp/mcp-build-{{ srv_name }}";
        {%- endfor %}
        exec python -u src/bin/service_chat.py
    {%- endif %}
    logging:
      options:
        max-size: 10m
    ports:
      - {{ chatbot_port_host }}:{{ chatbot_port_container }}
    restart: always
    {% if host_mode -%}
    network_mode: host
    {% endif %}
    {% if gpu_ids and use_podman -%}
    security_opt:
      - label:disable
    devices:
    {%- if gpu_ids == "all" %}
      - "nvidia.com/gpu=all"
    {%- else %}
      {%- for gpu_id in gpu_ids %}
      - "nvidia.com/gpu={{ gpu_id }}"
      {%- endfor %}
    {%- endif %}
    {%- endif %}
  {%- endif %}

