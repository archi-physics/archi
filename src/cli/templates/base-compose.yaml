      - {{ benchmarking_volume_name }}:/root/data/
      - ./queries.txt:/root/archi/QandA.txt
      - {{ benchmarking_dest }}:/root/archi/benchmarks
      - ./data/prompts:/root/archi/data/prompts:ro
      - ./data/agents:/root/archi/agents:ro
      - ./data/skills:/root/archi/skills:ro
      {% for prompt_file in prompt_files | default([]) -%}
      - ./{{ prompt_file }}:/root/archi/{{ prompt_file }}
      {% endfor %}
      {% if gpu_ids -%}
      - archi-models:/root/models/
      {%- endif %}
    logging:
      options:
        max-size: 10m
    {% if host_mode -%}
    network_mode: host
    {% endif %}
    {% if gpu_ids and use_podman -%}
    security_opt:
      - label:disable
    devices:
    {%- if gpu_ids == "all" %}
      - "nvidia.com/gpu=all"
    {%- else %}
      {%- for gpu_id in gpu_ids %}
      - "nvidia.com/gpu={{ gpu_id }}"
      {%- endfor %}
    {%- endif %}
    {%- endif %}
  {%- endif %}

  {#- MCP sidecar services: any mcp_server with build_context or image becomes its own container #}
  {%- for srv_name, srv_cfg in (mcp_servers | default({})).items() %}
  {%- if srv_cfg.build_context is defined or srv_cfg.image is defined %}
  {{ srv_name }}-mcp:
    container_name: {{ srv_name }}-mcp-{{ name }}
    {%- if srv_cfg.build_context is defined %}
    build: {{ srv_cfg.build_context }}
    {%- else %}
    image: {{ srv_cfg.image }}
    {%- endif %}
    {%- if srv_cfg.env or srv_cfg.env_from_secrets or srv_cfg.shared_volume %}
    environment:
      {%- for k, v in (srv_cfg.env | default({})).items() %}
      {{ k }}: "{{ v }}"
      {%- endfor %}
      {%- for k in srv_cfg.env_from_secrets | default([]) %}
      {{ k }}_FILE: /run/secrets/{{ k | lower }}
      {%- endfor %}
      {%- if srv_cfg.shared_volume %}
      {#- Derive the env var name mechanically: "indico-downloads" -> INDICO_DOWNLOADS_DIR. #}
      {{ (srv_cfg.shared_volume | upper | replace('-', '_')) }}_DIR: "/shared/{{ srv_cfg.shared_volume }}"
      {%- endif %}
    {%- endif %}
    {%- if srv_cfg.env_from_secrets %}
    secrets:
      {%- for k in srv_cfg.env_from_secrets %}
      - {{ k | lower }}
      {%- endfor %}
    {%- endif %}
    {%- if srv_cfg.host_file_mounts or srv_cfg.shared_volume %}
    volumes:
      {%- for m in srv_cfg.host_file_mounts | default([]) %}
      {%- if m is string %}
      - {{ m }}:{{ m }}:ro
      {%- else %}
      - {{ m.src }}:{{ m.dest }}:ro
      {%- endif %}
      {%- endfor %}
      {%- if srv_cfg.shared_volume %}
      - {{ srv_cfg.shared_volume }}-{{ name }}:/shared/{{ srv_cfg.shared_volume }}
      {%- endif %}
    {%- endif %}
    logging:
      options:
        max-size: 10m
    restart: always
    {%- if host_mode %}
    network_mode: host
    {%- endif %}
  {%- endif %}
  {%- endfor %}


volumes:
  {% for volume in required_volumes -%}
  {{ volume }}:
    external: true
  {% endfor %}
  {%- for srv_name, srv_cfg in (mcp_servers | default({})).items() %}
  {%- if srv_cfg.shared_volume %}
  {{ srv_cfg.shared_volume }}-{{ name }}:
  {%- endif %}
  {%- endfor %}

{% if required_secrets %}
secrets:
  {% for secret in required_secrets -%}
  {{ secret.lower() }}:
    file: secrets/{{ secret.lower() }}.txt
  {% endfor %}
{% endif %}
